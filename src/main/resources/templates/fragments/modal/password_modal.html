<div th:fragment="password_modal">
    <!--
        PasswordModal — 비밀번호 입력 모달
        JS:  /js/ui/modal_password.js
        CSS: /css/modal.css  (.pw-modal-* 섹션)

        init() 시점에 JS가 이 요소를 document.body로 이동시킵니다.
        (AdminLTE transform stacking-context 문제 방지)
    -->
    <div id="passwordModalOverlay" class="pw-modal-overlay" aria-hidden="true">
        <div class="pw-modal-box" id="passwordModalBox" role="dialog" aria-modal="true" aria-labelledby="pwModalTitle">
            <div class="pw-modal-header">
                <span class="pw-modal-icon" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                </span>
                <span class="pw-modal-title" id="pwModalTitle">비밀번호 확인</span>
            </div>

            <div class="pw-modal-body">
                <p class="pw-modal-message" id="pwModalMessage" style="display:none;"></p>
                <div class="pw-input-wrap">
                    <input type="password"
                           id="pwModalInput"
                           class="pw-modal-input"
                           placeholder="비밀번호를 입력하세요"
                           autocomplete="current-password"
                           maxlength="128" />
                    <button type="button" class="pw-toggle-eye" id="pwToggleEye"
                            tabindex="-1" aria-label="비밀번호 표시/숨김">
                        <svg id="pwEyeOff" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                             viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                        <svg id="pwEyeOn" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                             viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                             style="display:none;">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
                <p class="pw-modal-error" id="pwModalError" aria-live="assertive" role="alert"></p>
            </div>

            <div class="pw-modal-footer">
                <button type="button" class="pw-btn pw-btn-confirm" id="pwModalConfirmBtn">확인</button>
                <button type="button" class="pw-btn pw-btn-cancel"  id="pwModalCancelBtn">취소</button>
            </div>
        </div>
    </div>
</div>
