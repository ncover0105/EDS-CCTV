<div th:fragment="speaker_broadcast_modal" class="modal fade speaker-modal dark" id="speaker_broadcast_modal"
    tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">

            <!-- 상단 액센트 바 -->
            <div class="modal-accent" id="bc_mode_accent"></div>

            <!-- ── 헤더 ── -->
            <div class="modal-header">
                <div class="d-flex align-items-center gap-3 flex-grow-1">
                    <div class="modal-icon">
                        <i class="fa-solid fa-tower-broadcast"></i>
                    </div>
                    <div>
                        <div class="modal-title">방송</div>
                    </div>
                </div>
                <button type="button" class="sp-close" data-bs-dismiss="modal" aria-label="닫기">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>

            <div class="bc-inline-status d-none" id="bc_inline_status" role="status" aria-live="polite">
                <i class="bi bi-info-circle bc-inline-status-icon" aria-hidden="true"></i>
                <span id="bc_inline_status_text">안내 메시지</span>
            </div>

            <!-- ── 바디 ── -->
            <div class="modal-body">

                <!-- 왼쪽: 스피커 선택 -->
                <div class="panel-left">
                    <div class="panel-header">
                        <div class="panel-header-main">
                            <div class="panel-label">
                                스피커 리스트
                                <span class="badge-count" id="bc_speaker_count">0</span>
                            </div>
                            <button type="button" class="panel-action-btn panel-action-btn-refresh"
                                id="bc_refresh_speaker" title="스피커 목록 새로고침" aria-label="스피커 목록 새로고침">
                                <i class="fas fa-rotate-right"></i> 새로고침
                            </button>
                        </div>
                    </div>

                    <!-- 선택된 스피커 칩 영역 -->
                    <div class="selected-chips-wrap" id="bcchipswrap">
                        <span class="selected-chips-empty" id="bc_chips_empty">선택된 스피커 없음</span>
                    </div>

                    <!-- 빈 상태 -->
                    <div id="bc_empty_speaker" class="text-center py-4 d-none"
                        style="color:var(--m-text-muted);font-size:13px;">
                        <i class="bi bi-speaker mb-2 d-block fs-4"></i>
                        등록된 스피커가 없습니다.
                    </div>

                    <!-- 스피커 카드 목록 -->
                    <div class="speaker-list-wrap">
                        <div id="bc_speaker_list" class="d-flex flex-column"></div>
                    </div>

                    <!-- JS 호환 숨김 필드 -->
                    <input id="bc_selected_speaker_name" class="d-none" readonly placeholder="스피커를 선택하세요">
                </div>

                <!-- 오른쪽: 발령 설정 -->
                <div class="panel-right">
                    <div id="bc_area_type_b" class="bc-area-panel bc-area-type-b">
                        <div class="d-flex align-items-center justify-content-between px-1 pb-2 mb-3">
                            <div class="m-card-title bc-type-title-b mb-0">방송 설정</div>
                            <button type="button" class="m-btn m-btn-primary m-btn-hero" id="b_bc_send">
                                <i class="fa-solid fa-play"></i> 방송
                            </button>
                        </div>
                        <div class="bc-action-status d-none mb-2" id="b_bc_broadcast_status" role="status"
                            aria-live="polite"></div>


                        <!-- 방송 모드 -->
                        <div class="m-card">
                            <div class="m-card-title">송출 모드</div>
                            <div class="m-radio-group">
                                <label class="m-radio-option"> <input type="radio" name="b_bc_mode_radio" value="1"
                                        checked> <span class="m-radio-label"><i class="bi bi-broadcast me-1"></i> 실제
                                        방송</span> </label>
                                <label class="m-radio-option"> <input type="radio" name="b_bc_mode_radio" value="0">
                                    <span class="m-radio-label"><i class="bi bi-medium me-1"></i> 시험
                                        방송</span> </label>
                            </div>
                            <!-- JS가 직접 읽는 select (숨김) -->
                            <select id="b_bc_mode" class="d-none">
                                <option value="0">시험 방송</option>
                                <option value="1" selected>실제 방송</option>
                            </select>
                        </div>

                        <!-- 방송 유형 -->
                        <div class="m-card">
                            <div class="m-card-title">송출 방식</div>
                            <div class="m-radio-group">
                                <label class="m-radio-option">
                                    <input type="radio" name="b_bc_type_radio" value="1" checked>
                                    <span class="m-radio-label"><i class="bi bi-volume-up-fill me-1"></i> TTS</span>
                                </label>
                                <label class="m-radio-option">
                                    <input type="radio" name="b_bc_type_radio" value="2">
                                    <span class="m-radio-label"><i class="bi bi-play-circle-fill me-1"></i> 저장메시지</span>
                                </label>
                                <label class="m-radio-option">
                                    <input type="radio" name="b_bc_type_radio" value="3">
                                    <span class="m-radio-label"><i class="bi bi-rss me-1"></i> 기타</span>
                                </label>
                            </div>
                            <!-- JS가 직접 읽는 select (숨김) -->
                            <select id="b_bc_broadcast_type" class="d-none">
                                <option value="1" selected>TTS</option>
                                <option value="2">저장메시지</option>
                                <option value="3">기타</option>
                            </select>
                        </div>

                        <!-- 재난 선택 -->
                        <div class="m-card">
                            <div class="m-card-title">재난 메시지</div>
                            <label class="m-field-label" for="b_bc_disaster">
                                재난 유형
                            </label>
                            <select id="b_bc_disaster" class="m-select">
                                <option value="" selected>재난을 선택하세요</option>
                            </select>
                            <div class="m-err" id="b_bc_disaster_error"></div>
                        </div>

                        <!-- TTS 설정 -->
                        <div class="m-card" id="b_bc_tts_wrap">
                            <div class="m-card-title">직접 안내 메시지</div>
                            <div class="mb-3">
                                <label class="m-field-label" for="b_bc_tts_list">TTS 템플릿</label>
                                <select id="b_bc_tts_list" class="m-select">
                                    <option value="">TTS를 선택하세요</option>
                                </select>
                            </div>
                            <div>
                                <div class="d-flex align-items-center justify-content-between mb-2">
                                    <label class="m-field-label mb-0" for="b_bc_tts">안내 문구</label>
                                    <button type="button" class="panel-action-btn d-none" id="b_bc_open_tts_save"
                                        style="flex:none;padding:5px 10px;">
                                        현재 내용 저장
                                    </button>
                                </div>
                                <textarea id="b_bc_tts" class="m-textarea" rows="5" placeholder="TTS를 선택하거나 직접 입력하세요"
                                    maxlength="1000"
                                    oninput="document.getElementById('b_bc_tts_char_count').textContent=this.value.length;"></textarea>
                                <div class="char-counter">
                                    <span id="b_bc_tts_char_count">0</span> / 1000
                                </div>
                                <div class="m-err" id="b_bc_tts_error"></div>
                            </div>
                        </div>

                        <div class="m-card action-card">
                            <div class="m-card-title mb-0">스피커 제어</div>

                            <div class="bc-control-section bc-control-section-bgm">
                                <div class="bgm-control-row">
                                    <div class="bgm-copy">
                                        <div class="bc-control-label">BGM 실행</div>
                                        <div class="bgm-subtext">
                                            선택한 스피커에 배경음악을 바로 실행하거나 종료합니다.
                                        </div>
                                    </div>
                                    <div class="bgm-action-group" role="group" aria-label="BGM 즉시 제어">
                                        <button type="button" class="m-btn m-btn-primary m-btn-bgm m-btn-hero"
                                            id="b_bc_bgm_on">
                                            <i class="fa-solid fa-play"></i> BGM On
                                        </button>
                                        <button type="button" class="m-btn m-btn-ghost m-btn-bgm-off" id="b_bc_bgm_off">
                                            <i class="fa-solid fa-stop"></i> BGM Off
                                        </button>
                                    </div>
                                </div>
                                <div class="bc-action-status d-none" id="b_bc_bgm_status" role="status"
                                    aria-live="polite"></div>
                            </div>
                        </div>

                        <!-- JS 호환 숨김 필드 (기존 매핑 유지) -->
                        <div class="d-none">
                            <select id="b_bc_alert_type">
                                <option value="0" selected>CFW</option>
                                <option value="1">ACL</option>
                            </select>
                            <select id="b_bc_priority">
                                <option value="0">없음</option>
                                <option value="1">주의</option>
                                <option value="2">경계</option>
                                <option value="3" selected>위험</option>
                            </select>
                            <select id="b_bc_scope">
                                <option value="1">시/도</option>
                                <option value="2">군/구</option>
                                <option value="3" selected>스피커</option>
                            </select>
                            <small id="b_bc_step_text">스피커를 선택하세요.</small>
                        </div>


                    </div>
                </div><!-- /panel-right -->
            </div><!-- /modal-body -->

            <!-- ── 푸터 ── -->
            <div class="modal-footer">
                <div class="footer-info">
                    선택된 스피커:
                    <strong><span id="bc_selected_count_footer">0</span>개</strong>
                </div>
                <div class="footer-actions">
                    <button type="button" class="m-btn m-btn-ghost" data-bs-dismiss="modal">
                        닫기
                    </button>
                </div>
            </div>

        </div>
    </div>
</div>
