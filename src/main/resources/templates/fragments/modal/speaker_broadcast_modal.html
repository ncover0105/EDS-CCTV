<div th:fragment="speaker_broadcast_modal">
    <div class="modal fade modal-dark speaker-modal" id="speaker_broadcast_modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content bg-dark">

                <!-- Header -->
                <div class="modal-header border-0 pb-0">
                    <div class="d-flex flex-column py-2 ps-3">
                        <h5 class="modal-title text-white fw-bold">발령 모달</h5>
                        <small id="bc_hint" class="text-white-50">스피커 선택 후 발령 단계로 진행됩니다.</small>
                    </div>
                    <button type="button" class="close-btn" data-bs-dismiss="modal" aria-label="닫기">×</button>
                </div>

                <!-- Body -->
                <div class="modal-body d-flex flex-column min-h-0">
                    <div class="row flex-grow-1">
                        <div class="col-12 col-lg-5 d-flex">
                            <div class="setting-card h-100 w-100 pb-0 mb-0">
                                <div class="setting-title">
                                    <div class="row g-2 align-items-center w-100">
                            
                                        <!-- 제목 영역 (md 이상에서 더 넓게) -->
                                        <div class="col-12 col-md-6">
                                            <div class="d-flex align-items-center gap-2 text-nowrap">
                                                <span class="fw-semibold">스피커 리스트</span>
                                                <span class="badge info" id="bc_speaker_count">0 개</span>
                                            </div>
                                        </div>
                                    
                                        <!-- 버튼 전체 영역 -->
                                        <div class="col-12 col-md-6">
                                            <div class="row g-2">
                                                <div class="col-12 col-sm-6">
                                                    <button type="button"
                                                        class="btn-apple-base btn-apple-light btn-sm w-100 d-flex align-items-center justify-content-center"
                                                        id="bc_toggle_all">
                                                        전체 선택
                                                    </button>
                                                </div>
                                            
                                                <div class="col-12 col-sm-6">
                                                    <button type="button"
                                                        class="btn-apple-base btn-apple-light btn-sm w-100 d-flex align-items-center justify-content-center gap-2"
                                                        id="bc_refresh_speaker">
                                                        <i class="fas fa-rotate-right"></i>
                                                        갱신
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="setting-body">
                                    <div id="bc_empty_speaker" class="text-center text-white-50 py-4 d-none">
                                        <small>등록된 스피커가 없습니다.</small>
                                    </div>
                        
                                    <div class="speaker-list-container">
                                        <div id="bc_speaker_list" class="d-flex flex-column gap-2 py-1 pe-2"></div>
                                    </div>
                        
                                    <hr class="text-white-50 d-none">
                        
                                    <div class="d-flex flex-column gap-1 d-none">
                                        <input id="bc_selected_speaker_name" class="form-control" readonly placeholder="스피커를 선택하세요">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="col-12 col-lg-7 d-flex">
                            <div class="setting-card h-100 w-100">
                                <div class="setting-title">
                                    <div class="d-flex flex-column">
                                        <span class="fw-semibold">발령 설정</span>
                                        <small class="text-white-50" id="bc_step_text">스피커를 선택하세요.</small>
                                    </div>
    
                                    <div class="d-flex gap-2">
                                        <ul class="nav nav-pills mb-2" role="tablist">
                                            <li class="nav-item" role="presentation">
                                                <button class="nav-link active" id="tab-bc-manual"
                                                        data-bs-toggle="pill" data-bs-target="#pane-bc-manual"
                                                        type="button" role="tab">설정</button>
                                            </li>
                                            <li class="nav-item" role="presentation">
                                                <button class="nav-link" id="tab-bc-preview"
                                                        data-bs-toggle="pill" data-bs-target="#pane-bc-preview"
                                                        type="button" role="tab">TTS 관리</button>
                                            </li>
                                        </ul>
                                        <button type="button" class="btn-apple info d-flex align-items-center gap-2 d-none" id="bc_go_manual" disabled>
                                            <i class="bi bi-gear"></i>발령 설정
                                        </button>
                                    </div>
                                </div>
                                <div class="setting-body">
                                    <div class="tab-content">
                                        <!-- 설정 -->
                                        <div class="tab-pane fade show active w-100" id="pane-bc-manual" role="tabpanel">
                                            <div class="row g-3 w-100 h-100">
    
                                                <!-- 실제/시험 -->
                                                <div class="col-12 col-md-6">
                                                    <label class="form-label text-white-50">방송 모드</label>
                                                    <select id="bc_mode" class="form-select-dark">
                                                        <option value="0">시험 방송</option>
                                                        <option value="1" selected>실제 방송</option>
                                                    </select>
                                                </div>
    
                                                <!-- 경보 종류 -->
                                                <div class="col-12 col-md-6 d-none">
                                                    <label class="form-label text-white-50">경보 종류</label>
                                                    <select id="bc_alert_type" class="form-select form-select-sm">
                                                        <option value="0" selected>CFW</option>
                                                        <option value="1">ACL</option>
                                                    </select>
                                                </div>
    
                                                <!-- 방송 종류 -->
                                                <div class="col-12 col-md-6">
                                                    <label class="form-label text-white-50">방송 종류</label>
                                                    <select id="bc_broadcast_type" class="form-select-dark">
                                                        <option value="1" selected>TTS</option>
                                                        <option value="2">저장메시지</option>
                                                        <option value="3">기타</option>
                                                    </select>
                                                </div>
    
                                                <!-- 우선순위 -->
                                                <div class="col-12 col-md-6 d-none">
                                                    <label class="form-label text-white-50">우선순위</label>
                                                    <select id="bc_priority" class="form-select form-select-sm">
                                                        <option value="0">없음</option>
                                                        <option value="1">주의</option>
                                                        <option value="2">경계</option>
                                                        <option value="3" selected>위험</option>
                                                    </select>
                                                </div>
    
                                                <!-- 방송 범위 -->
                                                <div class="col-12 col-md-6 d-none">
                                                    <label class="form-label text-white-50">방송 범위</label>
                                                    <select id="bc_scope" class="form-select form-select-sm">
                                                            <option value="1">시/도</option>
                                                            <option value="2">군/구</option>
                                                            <option value="3" selected>스피커</option>
                                                    </select>
                                                </div>
    
                                                <!-- 재난 리스트 -->
                                                <div class="col-12">
                                                    <label class="form-label text-white-50">재난 선택</label>
                                                    <div class="d-flex gap-2">
                                                        <select id="bc_disaster" class="form-select-dark">
                                                            <option value="" selected>재난을 선택하세요</option>
                                                        </select>
                                                        <!-- <button type="button" class="btn-apple" id="bc_refresh_disaster">
                                                            <i class="fas fa-rotate-right me-1"></i>갱신
                                                        </button> -->
                                                    </div>
                                                </div>
    
                                                <!-- TTS 메시지 -->
                                                <div class="col-12" id="bc_tts_wrap">
                                                    <div class="d-flex align-items-center justify-content-between mb-3">
                                                        <label class="form-label text-white-50 mb-1">TTS 메시지</label>
                                                    
                                                        <div class="d-flex gap-2">
                                                            <button type="button" class="btn-apple-base btn-apple-light btn-sm" id="bc_open_tts_manage">
                                                                TTS 관리
                                                            </button>
                                                    
                                                            <!-- 선택: 빠른 저장(신규/수정)까지 하고 싶을 때만 -->
                                                            <button type="button" class="btn-apple info" id="bc_open_tts_save">
                                                            현재 내용 저장
                                                            </button>
                                                        </div>
                                                    </div>
                                                
                                                    <select id="bc_tts_list" class="form-select-dark mb-3">
                                                        <option value="">TTS를 선택하세요</option>
                                                    </select>
                                                
                                                    <textarea id="bc_tts" class="form-control-dark" rows="6"
                                                            placeholder="TTS를 선택하거나 직접 입력하세요"></textarea>
                                                </div>
                                                
    
                                                <!-- 버튼 -->
                                                <!-- <div class="col-12 d-flex justify-content-end gap-2 mt-2">
                                                    <button type="button" class="btn-apple danger" id="bc_send">
                                                        <i class="fas fa-bullhorn me-1"></i>발령
                                                    </button>
                                                </div> -->
                                            </div>
                                        </div>
    
                                        <!-- TTS 관리 -->
                                        <div class="tab-pane fade w-100" id="pane-bc-preview" role="tabpanel">
                                            <div class="row g-3 w-100 h-100">
                                                <div class="col-12">
                                                    <label class="form-label text-white-50">TTS 이름</label>
                                                    <input id="tts_name"
                                                            class="form-control-dark"
                                                            placeholder="예: 지진 대피 안내">
                                                </div>
                                                <div class="col-12">
                                                    <label class="form-label text-white-50">사용 여부</label>
                                                    <select id="tts_use_flag" class="form-select-dark">
                                                        <option value="Use" selected>Use</option>
                                                        <option value="NotUse">NotUse</option>
                                                    </select>
                                                </div>
                                                <div class="col-12">
                                                    <label class="form-label text-white-50 mb-2">메시지</label>
                                                    <textarea id="tts_msg"
                                                                class="form-control-dark flex-grow-1"
                                                                rows="8"
                                                                placeholder="TTS 메시지를 입력하세요">
                                                    </textarea>
                                                </div>
                                            </div>
                                            <pre id="bc_preview" class="p-3 overflow-y-auto d-none"
                                                style="background: rgba(0,0,0,0.35); border:1px solid rgba(255,255,255,0.1);
                                                        border-radius: 12px; color: #fff; white-space: pre-wrap; max-height: 300px;"></pre>
                                            <small class="text-white-50 d-none">발령 전 요청 payload를 확인합니다.</small>
                                        </div>
                                    </div>
                                    <!-- <div id="bc_manual_area">

                                    </div> -->
                                </div>
                            </div>

                        </div>
                    </div>
                </div>

                <div class="modal-footer border-0 d-flex">
                    <button type="button" class="btn-apple-base btn-apple-danger d-flex align-items-center gap-2" id="bc_send" style="flex: 0.8;">
                        <i class="fa-solid fa-volume-high"></i>발령
                    </button>

                    <button type="button" class="btn-apple-base btn-apple-secondary" data-bs-dismiss="modal" style="flex: 0.2;">
                        닫기
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
