<div th:fragment="tts_manage_modal">
    <div class="modal fade modal-dark speaker-modal" id="tts_manage_modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content bg-dark">

                <div class="modal-header border-0 d-flex align-items-center justify-content-between">
                    <h5 class="modal-title text-white fw-bold">TTS 관리</h5>
                    <div class="d-flex gap-2">
                        <button type="button" class="btn-apple info" id="tts_save">
                            저장
                        </button>
                        <button type="button" class="btn-apple danger" id="tts_delete">
                            삭제
                        </button>
                    </div>
                </div>

                <div class="modal-body d-flex flex-column">

                    <div class="row flex-grow-1 h-100">
                        <!-- LEFT: TTS 리스트 -->
                        <div class="col-12 col-lg-5 d-flex h-100">
                            <div class="setting-card h-100 w-100 p-0">
                                <div class="setting-title px-3 pt-3 pb-1 mb-0">
                                    <div class="d-flex flex-column gap-3 w-100">
                                        <span class="fw-semibold text-white">TTS 목록</span>
                                        <input id="tts_search" class="form-control-dark mb-3" placeholder="이름 / 메시지 검색">
                                        <div class="d-flex gap-2 d-none">
                                            <select id="tts_filter_use" class="form-select-dark form-select-sm">
                                                <option value="ALL">전체</option>
                                                <option value="Use" selected>Use</option>
                                                <option value="NotUse">NotUse</option>
                                            </select>
                                            <button type="button" class="btn-apple-base btn-apple light btn-sm"
                                                id="tts_refresh">
                                                갱신
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <div class="setting-body flex-fill overflow-auto position-relative ps-3">
                                    <!-- <input id="tts_search"
                                    class="form-control-dark mb-3"
                                    placeholder="이름 / 메시지 검색"> -->

                                    <div class="speaker-list-container d-flex flex-column pb-3">
                                        <div id="tts_list" class="d-flex flex-column gap-2 pe-1"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- RIGHT: 편집 -->
                        <div class="col-12 col-lg-7 d-flex">
                            <div class="setting-card h-100 w-100">
                                <div class="setting-title">
                                    <div class="d-flex flex-column gap-3">
                                        <span class="fw-semibold text-white">TTS 정보</span>
                                        <small class="text-white-50">
                                            목록을 선택하여 수정하거나 새 내용을 입력 후 저장하세요.
                                        </small>
                                    </div>
                                </div>

                                <div class="setting-body d-flex flex-column justify-content-center">

                                    <input type="hidden" id="tts_id">

                                    <!-- ✅ 간격 넓힘 -->
                                    <div class="mb-4">
                                        <label class="form-label text-white-50">TTS 이름</label>
                                        <input id="tts_name" class="form-control-dark" placeholder="예: 지진 대피 안내">
                                    </div>

                                    <div class="mb-4">
                                        <label class="form-label text-white-50">사용 여부</label>
                                        <select id="tts_use_flag" class="form-select-dark">
                                            <option value="Use" selected>Use</option>
                                            <option value="NotUse">NotUse</option>
                                        </select>
                                    </div>

                                    <div class="d-flex flex-column flex-grow-1 mb-0">
                                        <label class="form-label text-white-50 mb-2">메시지</label>
                                        <textarea id="tts_msg" class="form-control-dark flex-grow-1" rows="8"
                                            placeholder="TTS 메시지를 입력하세요">
                                    </textarea>
                                    </div>

                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-footer border-top-0">
                    <button type="button" class="btn-apple secondary" data-bs-dismiss="modal"
                        style="flex: 1;">닫기</button>
                </div>

            </div>
        </div>
    </div>
</div>
