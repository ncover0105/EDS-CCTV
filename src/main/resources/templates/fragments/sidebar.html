<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<nav th:fragment="sidebarFragment" class="sb-sidenav sb-sidenav-dark rounded-end p-2" id="sidenavAccordion">
    <div class="sb-sidenav-menu py-4">
        <ul class="nav flex-column px-2">

            <!-- 종합상황판 -->
            <li class="nav-item">
                <a class="nav-link text-nowrap" th:classappend="${currentPage == 'main' ? 'active' : ''}"
                    th:href="@{/main}">
                    <i class="bi bi-grid me-2"></i>종합상황판
                </a>
            </li>

            <!-- 장비관리 -->
            <li class="nav-item">
                <a class="nav-link text-nowrap" th:classappend="${currentPage == 'equipment2' ? 'active' : ''}"
                    th:href="@{/menu/equipment2}">
                    <i class="bi bi-cpu me-2"></i>장비관리
                </a>
            </li>

            <!-- 이력조회 (서브메뉴 collapse) -->
            <li class="nav-item">
                <a class="nav-link text-nowrap" th:classappend="${currentPage == 'situation' ? 'active' : ''}"
                    data-bs-toggle="collapse" href="#collapseHistory" role="button"
                    aria-expanded="${currentPage == 'situation' ? 'true' : 'false'}">
                    <i class="bi bi-clock-history me-2"></i>이력조회
                    <i class="bi bi-chevron-down ms-auto float-end"></i>
                </a>
                <div class="collapse" id="collapseHistory" th:classappend="${currentPage == 'situation' ? 'show' : ''}">
                    <ul class="nav flex-column ms-3">
                        <li class="nav-item">
                            <a class="nav-link text-nowrap" th:classappend="${view == 'situation' ? 'active' : ''}"
                                th:href="@{/menu/situation?view=situation}">
                                상황발생이력
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-nowrap" th:classappend="${view == 'broadcast' ? 'active' : ''}"
                                th:href="@{/menu/situation?view=broadcast}">
                                발령이력
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-nowrap" th:classappend="${view == 'special' ? 'active' : ''}"
                                th:href="@{/menu/situation?view=special}">
                                특보이력
                            </a>
                        </li>
                    </ul>
                </div>
            </li>

            <!-- 설정 (서브메뉴 collapse) -->
            <li class="nav-item">
                <a class="nav-link text-nowrap" th:classappend="${currentPage == 'settings' ? 'active' : ''}"
                    data-bs-toggle="collapse" href="#collapseSettings" role="button"
                    aria-expanded="${currentPage == 'settings' ? 'true' : 'false'}">
                    <i class="bi bi-gear me-2"></i>설정
                    <i class="bi bi-chevron-down ms-auto float-end"></i>
                </a>
                <div class="collapse" id="collapseSettings" th:classappend="${currentPage == 'settings' ? 'show' : ''}">
                    <ul class="nav flex-column ms-3">
                        <li class="nav-item">
                            <a class="nav-link text-nowrap" th:classappend="${view == 'user' ? 'active' : ''}"
                                th:href="@{/menu/settings?view=user}">
                                사용자설정
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-nowrap" th:classappend="${view == 'ment' ? 'active' : ''}"
                                th:href="@{/menu/settings?view=ment}">
                                문안설정
                            </a>
                        </li>
                        <!-- SMS알림설정: navbar와 동일하게 d-none -->
                        <li class="nav-item d-none">
                            <a class="nav-link text-nowrap" th:classappend="${view == 'sms' ? 'active' : ''}"
                                th:href="@{/menu/settings?view=sms}">
                                SMS알림설정
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-nowrap" th:classappend="${view == 'schedule' ? 'active' : ''}"
                                th:href="@{/menu/settings?view=schedule}">
                                방송 스케줄
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-nowrap" th:classappend="${view == 'set' ? 'active' : ''}"
                                th:href="@{/menu/settings?view=set}">
                                환경설정
                            </a>
                        </li>
                    </ul>
                </div>
            </li>

        </ul>

    </div>

    <div class="sb-sidenav-footer">
        <a class="btn quick-btn mt-3 w-100" th:href="@{/logout}">Logout</a>
    </div>
</nav>

</html>
