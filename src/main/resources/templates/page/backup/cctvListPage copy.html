<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCTV Management</title>
    <script src="/js/page/cctvlist.js"></script>
</head>

<body>
    <div class="container-fluid p-5 text-nowrap animate-fade-in" layout:fragment="content">
        <div class="d-flex flex-column h-100">
            <div class="top-panel p-4 mb-3">
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                    <div>
                        <h4 class="top-panel-title mb-3">
                            <i class="bi bi-camera-video title-icon"></i>
                            CCTV 목록
                        </h4>
                        <p class="top-panel-desc mb-0 small" id="userCount"
                            th:text="'등록된 CCTV 총 ' + ${#lists.size(cctvList)}  + '건 | 등록된 CCTV를 관리하세요'">등록된 CCTV 총 0명 |
                            등록된 CCTV를 관리하세요</p>
                    </div>
                    <div class="d-flex gap-2">
                        <button id="btn-register" class="btn-apple-base btn-apple-light">
                            <i class="bi bi-plus"></i>
                            <span class="d-none d-md-inline ms-1">추가</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="row g-3" style="height: 77vh;">
                <div class="col-12 h-100">
                    <div class="card card-dark h-100 w-100 overflow-hidden">
                        <!-- <div style="overflow:auto; flex:1; min-height:0;"> -->
                        <div class="card-body p-0 d-flex flex-column">

                            <div class="flex-grow-1 overflow-auto" style="min-height:0;">
                                <table class="table table-dark table-hover mb-0"
                                    style="table-layout: fixed; width: 100%; min-width: 1000px;">
                                    <colgroup>
                                        <col style="width: 15%;">
                                        <col style="width: 35%;">
                                        <col style="width: 10%;">
                                        <col style="width: 15%;">
                                        <col style="width: 15%;">
                                        <col style="width: 10%;">
                                    </colgroup>

                                    <thead>
                                        <tr>
                                            <th>CCTV명</th>
                                            <th>URL</th>
                                            <th>상태</th>
                                            <th>위도</th>
                                            <th>경도</th>
                                            <th>작업</th>
                                        </tr>
                                    </thead>

                                    <tbody id="cctvTableBody">
                                        <tr th:if="${#lists.isEmpty(cctvList)}" class="text-center">
                                            <td colspan="6" style="height: 60vh;">
                                                <div class="d-flex align-items-center justify-content-center h-100">
                                                    <span class="text-muted">
                                                        <i class="bi bi-inbox me-2"></i>
                                                        등록된 CCTV가 없습니다.
                                                    </span>
                                                </div>
                                            </td>
                                        </tr>
                                        <tr th:each="cctv, iterStat : ${cctvList}" th:attr="
                                                data-location-code=${cctv.locationCode},
                                                data-cctv-code=${cctv.cctvCode},
                                                data-login-id=${cctv.id},
                                                data-login-pw=${cctv.password}
                                            ">
                                            <td>
                                                <input type="checkbox" name="selectedCctv"
                                                    th:value="${cctv.locationCode + '|' + cctv.cctvCode}"
                                                    class="form-check-input cctv-checkbox" />
                                            </td>
                                            <td th:text="${cctv.cctvCode} ?: '-'"></td>
                                            <td th:text="${cctv.rtspUrl} ?: '-'"></td>
                                            <td>
                                                <!-- <span class="status-badge status-success bg-transparent d-inline-flex align-items-center gap-1" 
                                                    th:if="${cctv.statusCam == '1'}">
                                                    <i class="bi bi-check-circle-fill"></i> 정상
                                                </span>
                                                
                                                <span class="status-badge status-error bg-transparent d-inline-flex align-items-center gap-1" 
                                                    th:if="${cctv.statusCam == '0'}">
                                                    <i class="bi bi-x-circle-fill"></i> 신호없음
                                                </span> -->
                                                <span
                                                    class="status-badge status-success d-inline-flex align-items-center gap-1"
                                                    th:if="${cctv.statusCam == '1'}">
                                                    <i class="bi bi-check-circle-fill"></i> 정상
                                                </span>

                                                <span
                                                    class="status-badge status-error d-inline-flex align-items-center gap-1"
                                                    th:if="${cctv.statusCam == '0'}">
                                                    <i class="bi bi-x-circle-fill"></i> 신호없음
                                                </span>

                                                <span th:if="${#strings.isEmpty(cctv.statusCam)}">-</span>
                                            </td>
                                            <td th:text="${cctv.latitude} ?: '-'"></td>
                                            <td th:text="${cctv.longitude} ?: '-'"></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                    </div>
                </div>
                <div class="col-12 col-lg-4 h-100 d-none">

                    <div id="opsPanel" class="card card-dark h-100">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <div class="fw-bold">스트리밍 서버</div>
                            <div class="server-status">
                                <div class="status-indicator" id="serverStatus"></div>
                                <span id="serverStatusText">서버 온라인</span>
                            </div>
                        </div>
                        <div class="card-body">
                            <!-- 2) 내용(쌓이는 영역 / 필요하면 스크롤) -->
                            <div class="flex-grow-1 overflow-auto pe-1">

                                <!-- 상태 섹션 -->
                                <div class="border border-secondary rounded p-3 mb-3">
                                    <div class="fw-semibold mb-2">서버 상태</div>

                                    <div class="d-flex justify-content-between mb-2">
                                        <span class="text-muted small">Janus</span>
                                        <span id="janusStatusText" class="small">-</span>
                                    </div>

                                    <div class="d-flex justify-content-between mb-2">
                                        <span class="text-muted small">GStreamer</span>
                                        <span id="gstStatusText" class="small">-</span>
                                    </div>

                                    <div class="d-flex justify-content-between">
                                        <span class="text-muted small">마지막 확인</span>
                                        <span id="srvLastCheck" class="small">-</span>
                                    </div>
                                </div>

                                <!-- 로그/메시지 섹션 (원하면) -->
                                <div class="border border-secondary rounded p-3 mb-3">
                                    <div class="fw-semibold mb-2">상태 메시지</div>
                                    <div id="srvMsg" class="small text-white-50">-</div>
                                </div>

                                <!-- 기타 섹션(추가로 계속 아래로 쌓임) -->
                                <div class="border border-secondary rounded p-3 mb-3">
                                    <div class="fw-semibold mb-2">운영 메모</div>
                                    <div class="small text-white-50">재실행은 야간/비혼잡 시간 권장</div>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- <div class="rounded shadow-sm mb-3 menu-table-container">

                <div class="d-flex flex-column" style="min-width: 800px; height: 77vh;">

                </div>
            </div> -->
        </div>

        <div class="modal fade modal-dark" id="addCctvModal" tabindex="-1" aria-labelledby="addCctvModalLabel"
            aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header border-0">
                        <h5 class="modal-title" id="addCctvModalLabel">CCTV 추가</h5>
                        <button type="button" class="close-btn" data-bs-dismiss="modal" aria-label="닫기">×</button>
                    </div>
                    <div class="modal-body">
                        <form id="addCctvForm">

                            <div class="row g-3">
                                <div class="col-12 col-md-6">
                                    <label for="cctvLocationCode" class="form-label">LocationCode 코드</label>
                                    <input type="text" class="form-control" id="cctvLocationCode" required>
                                </div>
                                <!-- CCTV 코드 (전체 폭) -->
                                <div class="col-12 col-md-6">
                                    <label for="cctvCode" class="form-label">CCTV 코드</label>
                                    <input type="text" class="form-control" id="cctvCode" required>
                                </div>

                                <!-- CCTV 이름 -->
                                <div class="col-12 col-md-6">
                                    <label for="cctvName" class="form-label">CCTV 이름</label>
                                    <input type="text" class="form-control" id="cctvName" required>
                                </div>

                                <!-- Mountpoint ID -->
                                <div class="col-12 col-md-6">
                                    <label for="cctvMountpointId" class="form-label">Mountpoint ID</label>
                                    <input type="text" class="form-control" id="cctvMountpointId" placeholder="예: 1">
                                </div>

                                <!-- 접속 ID -->
                                <div class="col-12 col-md-6">
                                    <label for="cctvLoginId" class="form-label">접속 ID</label>
                                    <input type="text" class="form-control" id="cctvLoginId" placeholder="카메라 접속 ID">
                                </div>

                                <!-- 접속 Password -->
                                <div class="col-12 col-md-6">
                                    <label for="cctvLoginPassword" class="form-label">접속 Password</label>
                                    <input type="password" class="form-control" id="cctvLoginPassword"
                                        placeholder="카메라 접속 비밀번호">
                                </div>

                                <!-- RTSP URL (전체 폭) -->
                                <div class="col-12">
                                    <label for="cctvUrl" class="form-label">RTSP URL</label>
                                    <input type="text" class="form-control" id="cctvUrl">
                                </div>

                                <!-- Video Port -->
                                <div class="col-12 col-md-6">
                                    <label for="cctvVideoPort" class="form-label">Video Port</label>
                                    <input type="text" class="form-control" id="cctvVideoPort" placeholder="예: 554">
                                </div>

                                <!-- WS Port -->
                                <div class="col-12 col-md-6">
                                    <label for="cctvWsPort" class="form-label">WS Port</label>
                                    <input type="text" class="form-control" id="cctvWsPort" placeholder="예: 8188">
                                </div>

                                <!-- 위도 -->
                                <div class="col-12 col-md-6">
                                    <label for="cctvLat" class="form-label">위도</label>
                                    <input type="text" class="form-control" id="cctvLat" placeholder="예: 37.5665">
                                </div>

                                <!-- 경도 -->
                                <div class="col-12 col-md-6">
                                    <label for="cctvLng" class="form-label">경도</label>
                                    <input type="text" class="form-control" id="cctvLng" placeholder="예: 126.9780">
                                </div>
                            </div>

                        </form>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="button" class="btn btn-primary" onclick="submitAddCctv()"
                            style="flex: 0.8;">추가</button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"
                            style="flex: 0.2;">취소</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- CCTV 수정 모달 -->
        <div class="modal fade modal-dark" id="editCctvModal" tabindex="-1" aria-labelledby="editCctvModalLabel"
            aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content">
                    <div class="modal-header border-0">
                        <h6 class="modal-title" id="editCctvModalLabel">CCTV 수정</h6>
                        <button type="button" class="close-btn" data-bs-dismiss="modal" aria-label="닫기">×</button>
                    </div>

                    <div class="modal-body">
                        <form id="editCctvForm">

                            <div class="row g-3">
                                <div class="col-12 col-md-6">
                                    <label for="editCctvlocationCode" class="form-label">Location 코드</label>
                                    <input type="text" class="form-control" id="editCctvlocationCode" readonly>
                                </div>
                                <!-- CCTV 코드: 항상 한 줄(좌우 꽉) -->
                                <div class="col-12 col-md-6">
                                    <label for="editCctvCode" class="form-label">CCTV 코드</label>
                                    <input type="text" class="form-control" id="editCctvCode" readonly>
                                </div>

                                <!-- CCTV 이름 -->
                                <div class="col-12 col-md-6">
                                    <label for="editCctvName" class="form-label">CCTV 이름</label>
                                    <input type="text" class="form-control" id="editCctvName" required>
                                </div>

                                <!-- Mountpoint ID -->
                                <div class="col-12 col-md-6">
                                    <label for="editCctvMountpointId" class="form-label">Mountpoint ID</label>
                                    <input type="text" class="form-control" id="editCctvMountpointId">
                                </div>

                                <!-- 접속 ID -->
                                <div class="col-12 col-md-6">
                                    <label for="editCctvLoginId" class="form-label">접속 ID</label>
                                    <input type="text" class="form-control" id="editCctvLoginId"
                                        placeholder="카메라 접속 ID">
                                </div>

                                <!-- 접속 Password -->
                                <div class="col-12 col-md-6">
                                    <label for="editCctvLoginPassword" class="form-label">접속 Password</label>
                                    <input type="password" class="form-control" id="editCctvLoginPassword"
                                        placeholder="비밀번호(변경 시에만 입력)">
                                </div>

                                <!-- RTSP URL: 한 줄(좌우 꽉) -->
                                <div class="col-12">
                                    <label for="editCctvUrl" class="form-label">RTSP URL</label>
                                    <input type="text" class="form-control" id="editCctvUrl">
                                </div>

                                <!-- Video Port -->
                                <div class="col-12 col-md-6">
                                    <label for="editCctvVideoPort" class="form-label">Video Port</label>
                                    <input type="text" class="form-control" id="editCctvVideoPort">
                                </div>

                                <!-- WS Port -->
                                <div class="col-12 col-md-6">
                                    <label for="editCctvWsPort" class="form-label">WS Port</label>
                                    <input type="text" class="form-control" id="editCctvWsPort">
                                </div>

                                <!-- 위도 -->
                                <div class="col-12 col-md-6">
                                    <label for="editCctvLat" class="form-label">위도</label>
                                    <input type="text" step="any" class="form-control" id="editCctvLat">
                                </div>

                                <!-- 경도 -->
                                <div class="col-12 col-md-6">
                                    <label for="editCctvLng" class="form-label">경도</label>
                                    <input type="text" step="any" class="form-control" id="editCctvLng">
                                </div>
                            </div>

                        </form>
                    </div>

                    <div class="modal-footer border-0">
                        <button type="button" class="btn btn-primary" id="btn-save-edit-cctv"
                            style="flex: 0.8;">저장</button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"
                            style="flex: 0.2;">취소</button>
                    </div>

                </div>
            </div>
        </div>

    </div>
</body>

</html>
