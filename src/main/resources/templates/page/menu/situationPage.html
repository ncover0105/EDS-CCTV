<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">

<head>
    <meta charset="UTF-8" />
    <title th:text="${title}">EDS</title>
    <link rel="stylesheet" th:href="@{/css/page/situation.css?v=1}" />
    <!-- <script src="/js/page/situation.js?v=1"></script> -->
    <script th:inline="javascript">
        const currentView = /*[[${view}]]*/ 'none';
    </script>
    <!-- 공통 유틸 (항상 로드) -->
    <script src="/js/page/situation/situation_common.js?v=1"></script>

    <!-- view별로 필요한 파일만 로드 -->
    <script th:if="${view == 'situation'}" src="/js/page/situation/situation_view.js?v=1"></script>
    <script th:if="${view == 'broadcast'}" src="/js/page/situation/broadcast_view.js?v=1"></script>
    <script th:if="${view == 'special'}" src="/js/page/situation/special_view.js?v=1"></script>
</head>

<body>
    <div class="container-fluid p-0 d-flex flex-column" style="height:100vh; overflow:hidden;"
        layout:fragment="content">
        <div class="page-situation">
            <!-- Topbar -->
            <header class="sit-topbar">
                <div class="sit-topbar-content d-none">
                    <div class="sit-topbar-left">
                        <button type="button" class="sit-sidebar-toggle d-none" id="sitSidebarToggle"
                            aria-label="메뉴 열기">
                            <i class="bi bi-list"></i>
                        </button>
                        <h2 class="sit-page-title m-0">
                            <i class="bi bi-shield-lock-fill"></i>
                            이력관리
                        </h2>
                    </div>
                </div>
                <!-- Mobile Tab Nav (1024px 이하) -->
                <nav class="sit-tab-nav" aria-label="이력관리 탭">
                    <button class="sit-tab-item" type="button" data-view="situation"
                        th:classappend="${view == 'situation'} ? 'is-active' : ''">
                        <i class="bi bi-exclamation-triangle-fill"></i> 상황 발생
                    </button>
                    <button class="sit-tab-item" type="button" data-view="broadcast"
                        th:classappend="${view == 'broadcast'} ? 'is-active' : ''">
                        <i class="bi bi-broadcast"></i> 발령 이력
                    </button>
                    <button class="sit-tab-item" type="button" data-view="special"
                        th:classappend="${view == 'special'} ? 'is-active' : ''">
                        <i class="bi bi-cloud-lightning-rain-fill"></i> 특보 이력
                    </button>
                </nav>
            </header>

            <div class="sit-layout">
                <!-- Sidebar -->
                <aside class="sit-sidebar" id="sitSidebar" aria-label="상황실 메뉴"
                    th:classappend="${param.sidebar != null and param.sidebar[0] == 'collapsed'} ? ' is-collapsed' : ''">
                    <div class="sit-sidebar-content">
                        <nav class="sit-nav">
                            <button class="sit-nav-item" type="button" data-view="situation"
                                th:classappend="${view == 'situation'} ? 'is-active' : ''">
                                <i class="bi bi-exclamation-triangle-fill"></i>
                                <span class="sit-nav-label">상황 발생 이력</span>
                            </button>
                            <button class="sit-nav-item" type="button" data-view="broadcast"
                                th:classappend="${view == 'broadcast'} ? 'is-active' : ''">
                                <i class="bi bi-broadcast"></i>
                                <span class="sit-nav-label">발령 이력</span>
                            </button>
                            <button class="sit-nav-item" type="button" data-view="special"
                                th:classappend="${view == 'special'} ? 'is-active' : ''">
                                <i class="bi bi-cloud-lightning-rain-fill"></i>
                                <span class="sit-nav-label">특보 이력</span>
                            </button>
                        </nav>
                        <div class="sit-sidebar-footer">
                            <div class="sit-nav-toggle-hint" id="sitSidebarCollapse" role="button" tabindex="0"
                                aria-label="사이드바 접기/펼치기">
                                <i class="bi bi-chevron-left"></i>
                                <span class="sit-nav-label">접기</span>
                            </div>
                        </div>
                    </div>
                </aside>

                <main class="sit-main">
                    <!-- Main Content Pane -->
                    <section class="sit-pane is-active"
                        style="display:flex; flex-direction:column; flex:1; min-height:0; overflow:hidden;"
                        id="situation-active-pane">
                        <!-- 상황발생이력 -->
                        <div th:if="${view == 'situation'}"
                            class="sit-hist-pane h-100 w-100 d-flex flex-column animate-fade-in">
                            <!-- Top Bar -->
                            <header class="sit-hist-topbar">
                                <div class="sit-hist-title">
                                    <div class="sit-hist-icon">
                                        <i class="bi bi-exclamation-triangle-fill"></i>
                                    </div>
                                    <div class="sit-hist-title-text">
                                        <h3>상황 발생 이력</h3>
                                        <p id="situationCount">상황 발생 이력 총 0개 | 상황 발생 이력을 관리하세요</p>
                                    </div>
                                </div>
                            </header>

                            <!-- Date Filter / Search Bar -->
                            <div class="sit-hist-status-bar" style="gap: 15px; flex-wrap: wrap;">
                                <div class="d-flex align-items-center gap-2">
                                    <label for="startDateTime" class="form-label small mb-0 text-white-50">시작 일시</label>
                                    <input type="datetime-local" class="form-control form-control-sm form-control-dark"
                                        id="startDateTime">
                                </div>
                                <div class="d-flex align-items-center">
                                    <span class="fw-bold text-secondary">~</span>
                                </div>
                                <div class="d-flex align-items-center gap-2">
                                    <label for="endDateTime" class="form-label small mb-0 text-white-50">종료 일시</label>
                                    <input type="datetime-local" class="form-control form-control-sm form-control-dark"
                                        id="endDateTime">
                                </div>
                                <div class="d-flex align-items-center gap-2">
                                    <label for="boundaryFilter" class="form-label small mb-0 text-white-50">구역</label>
                                    <select class="form-select form-select-sm form-control-dark" id="boundaryFilter">
                                        <option value="">전체</option>
                                        <option value="1">1번 구역</option>
                                        <option value="2">2번 구역</option>
                                        <option value="3">3번 구역</option>
                                        <option value="4">4번 구역</option>
                                    </select>
                                </div>
                                <button type="button" class="btn-soft ms-auto" onclick="situationSearch()">
                                    <i class="bi bi-search me-1"></i>검색
                                </button>
                            </div>

                            <!-- Content Surface -->
                            <section class="sit-hist-surface">
                                <!-- Table Wrap -->
                                <div class="sit-hist-table-wrap h-100 overflow-hidden">
                                    <div class="table-responsive h-100 overflow-auto custom-scrollbar">
                                        <table class="table-modern w-100">
                                            <colgroup>
                                                <col style="width: 8%;">
                                                <col style="width: 14%;">
                                                <col style="width: 14%;">
                                                <col style="width: 10%;">
                                                <col style="width: 34%;">
                                                <col style="width: 20%;">
                                            </colgroup>
                                            <thead style="position: sticky; top: 0; z-index: 1;">
                                                <tr>
                                                    <th scope="col" class="text-center">번호</th>
                                                    <th scope="col">CCTV 코드</th>
                                                    <th scope="col">알림 코드</th>
                                                    <th scope="col" class="text-center">구역</th>
                                                    <th scope="col">내용</th>
                                                    <th scope="col">발생 시각</th>
                                                </tr>
                                            </thead>
                                            <tbody id="situationList"></tbody>
                                        </table>
                                    </div>
                                </div>
                                <!-- Pagination (우선 주석 처리) -->
                                <!--
                                <footer class="panel-footer">
                                    <ul class="pagination pagination-modern mb-0" id="situationPagination"></ul>
                                </footer>
                                -->
                            </section>
                        </div>

                        <!-- 발령 이력 섹션 -->
                        <div th:if="${view == 'broadcast'}"
                            class="sit-hist-pane h-100 w-100 d-flex flex-column animate-fade-in">
                            <header class="sit-hist-topbar">
                                <div class="sit-hist-title">
                                    <div class="sit-hist-icon">
                                        <i class="bi bi-broadcast"></i>
                                    </div>
                                    <div class="sit-hist-title-text">
                                        <h3>발령 이력</h3>
                                        <p id="broadcastCount">총 0건 | 발령 내역을 관리하세요</p>
                                    </div>
                                </div>
                            </header>

                            <div class="sit-hist-status-bar" style="justify-content: space-around; padding: 10px 20px;">
                                <div class="sit-hist-stat">
                                    <span class="sit-hist-stat-num text-primary" id="broadcast_stat_total">0</span>
                                    <span>전체 발령</span>
                                </div>
                                <div class="sit-hist-stat border-start ps-4 border-secondary">
                                    <span class="sit-hist-stat-num text-success" id="broadcast_stat_today">0</span>
                                    <span>오늘 발령</span>
                                </div>
                                <div class="sit-hist-stat border-start ps-4 border-secondary">
                                    <span class="sit-hist-stat-num text-info" id="broadcast_stat_real">0</span>
                                    <span>실제 방송</span>
                                </div>
                                <div class="sit-hist-stat border-start ps-4 border-secondary">
                                    <span class="sit-hist-stat-num text-warning" id="broadcast_stat_test">0</span>
                                    <span>실험 방송</span>
                                </div>
                            </div>

                            <div class="sit-hist-status-bar" style="gap: 15px; flex-wrap: wrap;">
                                <div class="d-flex align-items-center gap-2">
                                    <label for="broadcastStartDateTime"
                                        class="form-label small mb-0 text-white-50">시작일시</label>
                                    <input type="datetime-local" class="form-control form-control-sm form-control-dark"
                                        id="broadcastStartDateTime">
                                </div>
                                <div class="d-flex align-items-center gap-2">
                                    <label for="broadcastEndDateTime"
                                        class="form-label small mb-0 text-white-50">종료일시</label>
                                    <input type="datetime-local" class="form-control form-control-sm form-control-dark"
                                        id="broadcastEndDateTime">
                                </div>
                                <div class="d-flex align-items-center gap-2">
                                    <label for="broadcastModeFilter"
                                        class="form-label small mb-0 text-white-50">방송모드</label>
                                    <select class="form-select form-select-sm form-control-dark"
                                        id="broadcastModeFilter">
                                        <option value="">전체</option>
                                        <option value="REAL">실제</option>
                                        <option value="TEST">실험</option>
                                    </select>
                                </div>
                                <div class="d-flex align-items-center gap-2">
                                    <label for="broadcastPriorityFilter"
                                        class="form-label small mb-0 text-white-50">우선순위</label>
                                    <select class="form-select form-select-sm form-control-dark"
                                        id="broadcastPriorityFilter">
                                        <option value="">전체</option>
                                        <option value="NONE">없음</option>
                                        <option value="CAUTION">주의</option>
                                        <option value="WARNING">경고</option>
                                        <option value="DANGER">위험</option>
                                    </select>
                                </div>
                                <div class="d-flex gap-2 ms-auto">
                                    <button type="button" class="btn-soft" id="broadcastSearchBtn">
                                        <i class="bi bi-search me-1"></i>검색
                                    </button>
                                    <button type="button" class="btn-soft danger d-none" id="broadcastResetBtn">
                                        <i class="bi bi-x-circle me-1"></i>초기화
                                    </button>
                                    <button type="button" class="btn-soft d-none" data-bs-toggle="collapse"
                                        data-bs-target="#broadcastAdvancedFilter" aria-expanded="false">
                                        <i class="bi bi-sliders me-1"></i>고급
                                    </button>
                                </div>
                            </div>

                            <div id="broadcastAdvancedFilter" class="collapse sit-hist-status-bar border-top-0 pt-0">
                                <div class="d-flex align-items-center gap-2 w-100">
                                    <label for="broadcastSpeakerSearch"
                                        class="form-label small mb-0 text-white-50">스피커</label>
                                    <input type="text"
                                        class="form-control form-control-sm form-control-dark flex-grow-1"
                                        id="broadcastSpeakerSearch" placeholder="스피커 검색">
                                </div>
                                <div class="d-none w-100">
                                    <input type="text" id="broadcastMessageSearch" placeholder="메시지 검색">
                                </div>
                            </div>

                            <section
                                class="sit-hist-surface bg-transparent border-0 p-0 overflow-auto flex-grow-1 min-vh-0 mx-2 mb-2">
                                <div id="broadcastCardList" class="h-100">
                                    <div id="broadcastEmptyState" class="sit-hist-empty d-none mt-5 text-center">
                                        <div class="empty-icon"><i
                                                class="bi bi-broadcast display-1 opacity-50 mb-3 text-secondary"></i>
                                        </div>
                                        <h5 class="empty-title mb-1 text-secondary">발령 이력이 없습니다</h5>
                                        <div class="empty-desc mb-0 small text-secondary">검색 조건을 변경하여 확인해보세요</div>
                                    </div>
                                    <div id="broadcastCardItems"></div>
                                </div>
                            </section>
                        </div>

                        <!-- 특보이력 -->
                        <div th:if="${view == 'special'}"
                            class="sit-hist-pane h-100 w-100 d-flex flex-column animate-fade-in">
                            <!-- Top Bar -->
                            <header class="sit-hist-topbar">
                                <div class="sit-hist-title">
                                    <div class="sit-hist-icon">
                                        <i class="bi bi-cloud-lightning-rain-fill"></i>
                                    </div>
                                    <div class="sit-hist-title-text">
                                        <h3>특보 이력</h3>
                                        <p id="specialCount">총 0건 | 특보 이력을 관리하세요</p>
                                    </div>
                                </div>
                            </header>

                            <!-- Date Filter / Search Bar -->
                            <div class="sit-hist-status-bar" style="gap: 15px; flex-wrap: wrap;">
                                <div class="d-flex align-items-center gap-2">
                                    <label for="startDateTime" class="form-label small mb-0 text-white-50">시작일시</label>
                                    <input type="datetime-local" class="form-control form-control-sm form-control-dark"
                                        id="startDateTime">
                                </div>
                                <div class="d-flex align-items-center">
                                    <span class="fw-bold text-secondary">~</span>
                                </div>
                                <div class="d-flex align-items-center gap-2">
                                    <label for="endDateTime" class="form-label small mb-0 text-white-50">종료일시</label>
                                    <input type="datetime-local" class="form-control form-control-sm form-control-dark"
                                        id="endDateTime">
                                </div>
                                <div class="d-flex align-items-center gap-2">
                                    <label for="specialWrn" class="form-label small mb-0 text-white-50">특보 종류</label>
                                    <select class="form-select form-select-sm form-control-dark" id="specialWrn">
                                        <option value="">전체</option>
                                        <option value="W">강풍</option>
                                        <option value="R">호우</option>
                                        <option value="C">한파</option>
                                        <option value="D">건조</option>
                                        <option value="O">해일</option>
                                        <option value="N">지진해일</option>
                                        <option value="V">풍랑</option>
                                        <option value="T">태풍</option>
                                        <option value="S">대설</option>
                                        <option value="Y">황사</option>
                                        <option value="H">폭염</option>
                                        <option value="F">안개</option>
                                    </select>
                                </div>
                                <div class="d-flex align-items-center gap-2">
                                    <label for="specialLvl" class="form-label small mb-0 text-white-50">특보 단계</label>
                                    <select class="form-select form-select-sm form-control-dark" id="specialLvl">
                                        <option value="">전체</option>
                                        <option value="1">예비</option>
                                        <option value="2">주의보</option>
                                        <option value="3">경보</option>
                                    </select>
                                </div>
                                <button type="button" class="btn-soft ms-auto" onclick="situationSearch()">
                                    <i class="bi bi-search me-1"></i>검색
                                </button>
                            </div>

                            <!-- Content Surface -->
                            <section class="sit-hist-surface">
                                <!-- Table Wrap -->
                                <div class="sit-hist-table-wrap h-100 overflow-hidden">
                                    <div class="table-responsive h-100 overflow-auto custom-scrollbar">
                                        <table class="table-modern w-100">
                                            <colgroup>
                                                <col style="width: 5%;">
                                                <col style="width: 10%;">
                                                <col style="width: 20%;">
                                                <col style="width: 20%;">
                                                <col style="width: 15%;">
                                                <col style="width: 15%;">
                                                <col style="width: 15%;">
                                            </colgroup>
                                            <thead style="position: sticky; top: 0; z-index: 1;">
                                                <tr>
                                                    <th>번호</th>
                                                    <th>특보 명</th>
                                                    <th>특보 발생 시각</th>
                                                    <th>특보 발생 지역</th>
                                                    <th>특보 수준</th>
                                                    <th>특보 명령</th>
                                                    <th>승인 상태</th>
                                                </tr>
                                            </thead>
                                            <tbody id="specialList"></tbody>
                                        </table>
                                    </div>
                                </div>
                                <!-- Pagination (우선 주석 처리) -->
                                <!--
                                <footer class="panel-footer">
                                    <ul class="pagination pagination-modern mb-0" id="specialPagination"></ul>
                                </footer>
                                -->
                            </section>
                        </div>
                    </section>
                </main>
            </div>
            <!-- 모바일 사이드바 오버레이 -->
            <div class="sit-overlay" id="sitOverlay"></div>
        </div>

    </div>
</body>

</html>
