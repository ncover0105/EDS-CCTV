<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCTV Management</title>
    <!-- Pinterest 스타일 CSS 추가 -->
    <link rel="stylesheet" th:href="@{/css/pinterest-cctv.css}" />

    <script src="/js/page/cctvlist.js"></script>
</head>

<body>
    <div class="container-fluid text-nowrap animate-fade-in" layout:fragment="content">
        <div class="d-flex flex-column h-100">
            <!-- Pinterest 스타일 헤더 -->
            <div class="pinterest-header mx-5 my-4">
                <div class="pinterest-header-content">
                    <div class="pinterest-header-left">
                        <div class="pinterest-title-wrapper">
                            <i class="bi bi-camera-video pinterest-title-icon"></i>
                            <h2 class="pinterest-title">CCTV 관리</h2>
                        </div>
                        <p class="pinterest-description" id="userCount"
                            th:text="'등록된 CCTV 총 ' + ${#lists.size(cctvList)}  + '건 | 모든 CCTV를 한눈에 확인하고 관리하세요'">
                            등록된 CCTV 총 0건 | 모든 CCTV를 한눈에 확인하고 관리하세요
                        </p>
                    </div>
                    <div class="pinterest-header-right">
                        <button id="btn-register" class="pinterest-btn-primary">
                            <i class="bi bi-plus-lg"></i>
                            <span>새 CCTV 추가</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Pinterest 스타일 카드 그리드 -->
            <div class="pinterest-grid-container px-5 py-3">
                <div id="cctvTableBody" class="pinterest-grid">

                    <!-- 빈 목록일 때 Empty State -->
                    <div th:if="${#lists.isEmpty(cctvList)}" class="pinterest-empty-state">
                        <div class="empty-state-icon">
                            <i class="bi bi-camera-video"></i>
                        </div>
                        <h3 class="empty-state-title">아직 등록된 CCTV가 없습니다</h3>
                        <p class="empty-state-description">
                            새 CCTV를 추가하여 실시간 모니터링을 시작하세요
                        </p>
                        <button id="btn-register" class="pinterest-btn-secondary">
                            <i class="bi bi-plus-lg"></i>
                            첫 CCTV 추가하기
                        </button>
                    </div>

                    <!-- CCTV 카드 반복 -->
                    <div class="pinterest-card" th:each="cctv, iterStat : ${cctvList}" th:if="${cctv != null}" th:attr="data-location-code=${cctv.locationCode},
                            data-cctv-code=${cctv.cctvCode},
                            data-name=${cctv.name},
                            data-login-id=${cctv.id},
                            data-login-pw=${cctv.password},
                            data-rtsp-url=${cctv.rtspUrl},
                            data-latitude=${cctv.latitude},
                            data-longitude=${cctv.longitude},
                            data-mountpoint-id=${cctv.mountpointId},
                            data-video-port=${cctv.videoPort},
                            data-ws-port=${cctv.wsPort}">

                        <!-- 카드 헤더 (체크박스 + 상태) -->
                        <div class="pinterest-card-header">
                            <div class="card-checkbox-wrapper">
                                <input type="checkbox" name="selectedCctv"
                                    th:value="${cctv.locationCode + '|' + cctv.cctvCode}"
                                    class="form-check-input cctv-checkbox pinterest-checkbox"
                                    th:id="'cctv-check-' + ${iterStat.index}" />

                                <label class="checkbox-label" th:for="'cctv-check-' + ${iterStat.index}"></label>
                            </div>
                            <div class="card-status-wrapper">
                                <span class="pinterest-badge pinterest-badge-success" th:if="${cctv.statusCam == '1'}">
                                    <i class="bi bi-check-circle-fill"></i>
                                    <span>정상</span>
                                </span>

                                <span class="pinterest-badge pinterest-badge-error" th:if="${cctv.statusCam == '0'}">
                                    <i class="bi bi-x-circle-fill"></i>
                                    <span>신호없음</span>
                                </span>

                                <span class="pinterest-badge pinterest-badge-unknown"
                                    th:if="${#strings.isEmpty(cctv.statusCam)}">
                                    <i class="bi bi-question-circle-fill"></i>
                                    <span>알 수 없음</span>
                                </span>
                            </div>
                        </div>

                        <!-- 카드 바디 -->
                        <div class="pinterest-card-body">
                            <!-- CCTV 코드 -->
                            <div class="card-main-info">
                                <h3 class="card-title" th:text="${cctv.cctvCode} ?: '-'">CCTV-001</h3>
                                <p class="card-subtitle" th:text="'Location: ' + (${cctv.locationCode} ?: 'N/A')">
                                    Location: LOC-001</p>
                            </div>

                            <!-- RTSP URL -->
                            <div class="card-url-section">
                                <div class="card-label">
                                    <i class="bi bi-link-45deg"></i>
                                    <span>RTSP URL</span>
                                </div>
                                <div class="card-url-value" th:text="${cctv.rtspUrl} ?: '-'">
                                    rtsp://example.com/stream
                                </div>
                            </div>

                            <!-- 위치 정보 -->
                            <div class="card-location-grid">
                                <div class="card-location-item">
                                    <div class="card-label">
                                        <i class="bi bi-geo-alt"></i>
                                        <span>위도</span>
                                    </div>
                                    <div class="card-value" th:text="${cctv.latitude} ?: '-'">37.5665</div>
                                </div>
                                <div class="card-location-item">
                                    <div class="card-label">
                                        <i class="bi bi-geo-alt-fill"></i>
                                        <span>경도</span>
                                    </div>
                                    <div class="card-value" th:text="${cctv.longitude} ?: '-'">126.9780</div>
                                </div>
                            </div>
                        </div>

                        <!-- 카드 푸터 (액션 버튼) -->
                        <div class="pinterest-card-footer">
                            <button type="button" class="card-action-btn card-action-edit" title="수정"></button>

                            <button type="button" class="card-action-btn card-action-delete" title="삭제"></button>
                        </div>
                    </div>

                </div>
            </div>

            <!-- 숨겨진 Operations Panel (기존 코드 유지) -->
            <div class="col-12 col-lg-4 h-100 d-none">
                <div id="opsPanel" class="card card-dark h-100">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <div class="fw-bold">스트리밍 서버</div>
                        <div class="server-status">
                            <div class="status-indicator" id="serverStatus"></div>
                            <span id="serverStatusText">서버 온라인</span>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="flex-grow-1 overflow-auto pe-1">
                            <!-- Operations Panel Content -->
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- CCTV 추가 모달 (Pinterest 스타일) -->
        <div class="modal fade pinterest-modal" id="addCctvModal" tabindex="-1" aria-labelledby="addCctvModalLabel"
            aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content pinterest-modal-content">
                    <div class="pinterest-modal-header">
                        <div class="modal-header-left">
                            <i class="bi bi-camera-video-fill modal-icon"></i>
                            <h5 class="pinterest-modal-title" id="addCctvModalLabel">새 CCTV 추가</h5>
                        </div>
                        <button type="button" class="sp-close" data-bs-dismiss="modal" aria-label="닫기">
                            <i class="bi bi-x-lg"></i>
                        </button>
                    </div>

                    <div class="pinterest-modal-body">
                        <form id="addCctvForm">
                            <div class="pinterest-form-grid">
                                <!-- Location 코드 -->
                                <div class="pinterest-form-group full-width">
                                    <label for="cctvlocationCode" class="pinterest-form-label">
                                        Location 코드
                                        <span class="required-mark">*</span>
                                    </label>
                                    <input type="text" class="pinterest-form-control" id="cctvlocationCode" required>
                                </div>

                                <!-- CCTV 코드 -->
                                <div class="pinterest-form-group full-width">
                                    <label for="cctvCode" class="pinterest-form-label">
                                        CCTV 코드
                                        <span class="required-mark">*</span>
                                    </label>
                                    <input type="text" class="pinterest-form-control" id="cctvCode" required>
                                </div>

                                <!-- CCTV 이름 -->
                                <div class="pinterest-form-group">
                                    <label for="cctvName" class="pinterest-form-label">CCTV 이름</label>
                                    <input type="text" class="pinterest-form-control" id="cctvName"
                                        placeholder="예: 정문 CCTV">
                                </div>

                                <!-- Mountpoint ID -->
                                <div class="pinterest-form-group">
                                    <label for="cctvMountpointId" class="pinterest-form-label">Mountpoint ID</label>
                                    <input type="text" class="pinterest-form-control" id="cctvMountpointId"
                                        placeholder="예: stream1">
                                </div>

                                <!-- 접속 ID -->
                                <div class="pinterest-form-group">
                                    <label for="cctvLoginId" class="pinterest-form-label">접속 ID</label>
                                    <input type="text" class="pinterest-form-control" id="cctvLoginId"
                                        placeholder="카메라 접속 ID">
                                </div>

                                <!-- 접속 Password -->
                                <div class="pinterest-form-group">
                                    <label for="cctvLoginPassword" class="pinterest-form-label">접속 Password</label>
                                    <input type="password" class="pinterest-form-control" id="cctvLoginPassword"
                                        placeholder="카메라 접속 비밀번호">
                                </div>

                                <!-- RTSP URL -->
                                <div class="pinterest-form-group full-width">
                                    <label for="cctvUrl" class="pinterest-form-label">RTSP URL</label>
                                    <input type="text" class="pinterest-form-control" id="cctvUrl"
                                        placeholder="rtsp://example.com/stream">
                                </div>

                                <!-- Video Port -->
                                <div class="pinterest-form-group">
                                    <label for="cctvVideoPort" class="pinterest-form-label">Video Port</label>
                                    <input type="text" class="pinterest-form-control" id="cctvVideoPort"
                                        placeholder="예: 554">
                                </div>

                                <!-- WS Port -->
                                <div class="pinterest-form-group">
                                    <label for="cctvWsPort" class="pinterest-form-label">WS Port</label>
                                    <input type="text" class="pinterest-form-control" id="cctvWsPort"
                                        placeholder="예: 8188">
                                </div>

                                <!-- 위도 -->
                                <div class="pinterest-form-group">
                                    <label for="cctvLat" class="pinterest-form-label">위도</label>
                                    <input type="text" class="pinterest-form-control" id="cctvLat"
                                        placeholder="예: 37.5665">
                                </div>

                                <!-- 경도 -->
                                <div class="pinterest-form-group">
                                    <label for="cctvLng" class="pinterest-form-label">경도</label>
                                    <input type="text" class="pinterest-form-control" id="cctvLng"
                                        placeholder="예: 126.9780">
                                </div>
                            </div>
                        </form>
                    </div>

                    <div class="pinterest-modal-footer">
                        <button type="button" class="pinterest-btn-secondary" data-bs-dismiss="modal">
                            취소
                        </button>
                        <button type="button" class="pinterest-btn-primary" onclick="submitAddCctv()">
                            <i class="bi bi-check-lg"></i>
                            추가
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- CCTV 수정 모달 (Pinterest 스타일) -->
        <div class="modal fade pinterest-modal" id="editCctvModal" tabindex="-1" aria-labelledby="editCctvModalLabel"
            aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content pinterest-modal-content">
                    <div class="pinterest-modal-header">
                        <div class="modal-header-left">
                            <i class="bi bi-pencil-square modal-icon"></i>
                            <h5 class="pinterest-modal-title" id="editCctvModalLabel">CCTV 수정</h5>
                        </div>
                        <button type="button" class="sp-close" data-bs-dismiss="modal" aria-label="닫기">
                            <i class="bi bi-x-lg"></i>
                        </button>
                    </div>

                    <div class="pinterest-modal-body">
                        <form id="editCctvForm">
                            <div class="pinterest-form-grid">
                                <!-- Location 코드 -->
                                <div class="pinterest-form-group">
                                    <label for="editCctvlocationCode" class="pinterest-form-label">Location 코드</label>
                                    <input type="text" class="pinterest-form-control" id="editCctvlocationCode"
                                        readonly>
                                </div>

                                <!-- CCTV 코드 -->
                                <div class="pinterest-form-group">
                                    <label for="editCctvCode" class="pinterest-form-label">CCTV 코드</label>
                                    <input type="text" class="pinterest-form-control" id="editCctvCode" readonly>
                                </div>

                                <!-- CCTV 이름 -->
                                <div class="pinterest-form-group">
                                    <label for="editCctvName" class="pinterest-form-label">CCTV 이름</label>
                                    <input type="text" class="pinterest-form-control" id="editCctvName" required>
                                </div>

                                <!-- Mountpoint ID -->
                                <div class="pinterest-form-group">
                                    <label for="editCctvMountpointId" class="pinterest-form-label">Mountpoint ID</label>
                                    <input type="text" class="pinterest-form-control" id="editCctvMountpointId">
                                </div>

                                <!-- 접속 ID -->
                                <div class="pinterest-form-group">
                                    <label for="editCctvLoginId" class="pinterest-form-label">접속 ID</label>
                                    <input type="text" class="pinterest-form-control" id="editCctvLoginId"
                                        placeholder="카메라 접속 ID">
                                </div>

                                <!-- 접속 Password -->
                                <div class="pinterest-form-group">
                                    <label for="editCctvLoginPassword" class="pinterest-form-label">접속 Password</label>
                                    <input type="password" class="pinterest-form-control" id="editCctvLoginPassword"
                                        placeholder="비밀번호(변경 시에만 입력)">
                                </div>

                                <!-- RTSP URL -->
                                <div class="pinterest-form-group full-width">
                                    <label for="editCctvUrl" class="pinterest-form-label">RTSP URL</label>
                                    <input type="text" class="pinterest-form-control" id="editCctvUrl">
                                </div>

                                <!-- Video Port -->
                                <div class="pinterest-form-group">
                                    <label for="editCctvVideoPort" class="pinterest-form-label">Video Port</label>
                                    <input type="text" class="pinterest-form-control" id="editCctvVideoPort">
                                </div>

                                <!-- WS Port -->
                                <div class="pinterest-form-group">
                                    <label for="editCctvWsPort" class="pinterest-form-label">WS Port</label>
                                    <input type="text" class="pinterest-form-control" id="editCctvWsPort">
                                </div>

                                <!-- 위도 -->
                                <div class="pinterest-form-group">
                                    <label for="editCctvLat" class="pinterest-form-label">위도</label>
                                    <input type="text" step="any" class="pinterest-form-control" id="editCctvLat">
                                </div>

                                <!-- 경도 -->
                                <div class="pinterest-form-group">
                                    <label for="editCctvLng" class="pinterest-form-label">경도</label>
                                    <input type="text" step="any" class="pinterest-form-control" id="editCctvLng">
                                </div>
                            </div>
                        </form>
                    </div>

                    <div class="pinterest-modal-footer">
                        <button type="button" class="pinterest-btn-secondary" data-bs-dismiss="modal">
                            취소
                        </button>
                        <button type="button" class="pinterest-btn-primary" id="btn-save-edit-cctv">
                            <i class="bi bi-check-lg"></i>
                            저장
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>

</html>
