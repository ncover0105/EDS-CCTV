<div th:fragment="broadcastPane" class="broadcast-pane-root">
    <div class="broadcast-pane">

        <!-- =====================================================
             Top Bar — 공통 영역 (구조 유지, phase-steps 리디자인)
             ===================================================== -->
        <header class="broadcast-topbar">
            <div class="broadcast-title">
                <div class="broadcast-icon">
                    <i class="bi bi-broadcast"></i>
                </div>
                <div class="broadcast-title-text">
                    <h3>방송 관리</h3>
                    <p id="broadcastCountText">실시간 방송 제어 시스템</p>
                </div>
            </div>

            <!-- Phase Steps (리디자인: 수직 아이콘 + 구분선 제거, HUD 스타일) -->
            <div class="bc-phase-steps">
                <div class="bc-phase-step" id="bcPhase1">
                    <div class="bc-phase-icon">1</div>
                    <div class="bc-phase-label">
                        <span class="bc-phase-title">대상 선택</span>
                        <span class="bc-phase-count" id="selectedTargetSpeakerCount">0</span>
                    </div>
                </div>
                <div class="bc-phase-connector"></div>
                <div class="bc-phase-step is-active" id="bcPhase2">
                    <div class="bc-phase-icon">2</div>
                    <div class="bc-phase-label">
                        <span class="bc-phase-title">메시지 구성</span>
                    </div>
                </div>
                <div class="bc-phase-connector"></div>
                <div class="bc-phase-step" id="bcPhase3">
                    <div class="bc-phase-icon">3</div>
                    <div class="bc-phase-label">
                        <span class="bc-phase-title">실행</span>
                        <span class="bc-phase-state" id="bcPhase3State">대기</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- =====================================================
             3-Column Pipeline  [V4 Mission Control]
             Desktop  : [260px] | [1fr] | [280px]
             Tablet   : [1fr 1fr] top + [full] bottom
             Mobile   : single column stack
             ===================================================== -->
        <div class="bc-pipeline">

            <!-- ══════════════════════════════════════════
                 Col 1 : 대상 스피커
                 ══════════════════════════════════════════ -->
            <div class="bc-target-col">
                <div class="bcp-panel bcp-panel--speakers">
                    <div class="bcp-panel-band">
                        <div class="bcp-band-title">
                            <i class="bi bi-speaker-fill"></i>
                            <span>대상 스피커</span>
                        </div>
                    </div>

                    <div class="bcp-search-row">
                        <i class="bi bi-search"></i>
                        <input id="targetSpeakerSearch" type="text" placeholder="ID / 이름 / 지역 검색" autocomplete="off">
                    </div>

                    <div class="bcp-selectall-row">
                        <input type="checkbox" id="targetSpeakerSelectAll" class="bcp-chk">
                        <label for="targetSpeakerSelectAll">전체 선택</label>
                    </div>

                    <div class="bcp-list-scroll custom-scrollbar" id="bc-target-list-scroll">
                        <div id="targetSpeakerList"></div>
                        <div id="targetSpeakerEmpty" class="d-none bcp-empty">
                            <i class="bi bi-inbox"></i>
                            <p>검색된 스피커가 없습니다</p>
                            <small>검색어를 조정하거나 목록을 다시 확인하세요.</small>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ══════════════════════════════════════════
                 Col 2 : 메시지 구성
                 ══════════════════════════════════════════ -->
            <div class="bc-compose-col">
                <div class="bcp-panel bcp-panel--compose is-default-pending">
                    <div class="bcp-panel-band">
                        <div class="bcp-band-title">
                            <i class="bi bi-pencil-square"></i>
                            <span>메시지 구성</span>
                        </div>
                    </div>

                    <!-- 방송 모드 & 카테고리 — 탭 스타일 -->
                    <div class="bcp-tabs-section is-default-pending">
                        <div class="bcp-tab-group">
                            <span class="bcp-tab-lbl">방송 모드</span>
                            <div class="bcp-tab-btns">
                                <button type="button" class="bc-choice-btn bcp-tab" data-target="bc_mode"
                                    data-value="1">실제 방송</button>
                                <button type="button" class="bc-choice-btn bcp-tab" data-target="bc_mode"
                                    data-value="0">시험 방송</button>
                            </div>
                        </div>
                        <div class="bcp-tab-group">
                            <span class="bcp-tab-lbl">방송 유형</span>
                            <div class="bcp-tab-btns">
                                <button type="button" class="bc-choice-btn bcp-tab" data-target="bc_broadcast_type"
                                    data-value="1">TTS</button>
                                <button type="button" class="bc-choice-btn bcp-tab" data-target="bc_broadcast_type"
                                    data-value="2">저장 메시지</button>
                                <button type="button" class="bc-choice-btn bcp-tab" data-target="bc_broadcast_type"
                                    data-value="3">기타</button>
                            </div>
                        </div>
                    </div>

                    <!-- 입력 영역 -->
                    <div class="bcp-compose-area">

                        <!-- TTS 입력 -->
                        <div class="bcp-input-block" id="customMessageArea">
                            <div class="bcp-input-meta">
                                <span>메시지 작성</span>
                                <span class="bcp-hint">방송할 내용을 직접 입력하세요.</span>
                            </div>
                            <div class="bc-tts-picker">
                                <div class="bc-tts-select-shell">
                                    <i class="bi bi-chat-left-text bc-tts-select-icon" aria-hidden="true"></i>
                                    <div class="bc-tts-select-copy">
                                        <select id="bc_tts_list" class="form-select-dark form-select-sm"
                                            aria-label="TTS 프리셋 선택">
                                            <option value="">직접 입력</option>
                                        </select>
                                    </div>
                                </div>
                                <button type="button" class="bc-tts-manage-btn" id="bc_open_tts_manage">
                                    <i class="bi bi-sliders" aria-hidden="true"></i>
                                    <span>TTS 관리</span>
                                </button>
                            </div>
                            <textarea class="bcp-textarea" id="customMessageText" maxlength="1000"
                                placeholder="이곳에 방송 내용을 입력하십시오..."></textarea>
                            <div class="bcp-char-count">
                                <span id="customMessageCount">0</span> / 1000
                            </div>
                        </div>

                        <!-- 재난 메시지 선택 -->
                        <div class="bcp-input-block d-none" id="bc_disaster_area">
                            <div class="bcp-input-meta">
                                <span>재난 메시지 선택</span>
                                <span class="bcp-hint">등록된 메시지 중 하나를 선택하십시오.</span>
                            </div>
                            <select id="bc_disaster" class="d-none">
                                <option value="">-- 선택 --</option>
                            </select>
                            <div id="bc_disaster_card_list" class="bc-disaster-card-list custom-scrollbar"></div>
                            <div id="bc_disaster_empty" class="d-none bcp-empty">
                                <i class="bi bi-inbox"></i>
                                <p>등록된 재난 메시지가 없습니다.</p>
                            </div>
                            <div id="bc_disaster_msg_area" class="bcp-msg-preview d-none" hidden>
                                <i class="bi bi-check-circle-fill"></i>
                                <div id="bc_disaster_msg_text"></div>
                            </div>
                        </div>

                    </div><!-- /bcp-compose-area -->

                    <!-- 전송 진행 상태 -->
                    <div id="broadcastProgress" class="d-none bcp-progress-bar">
                        <div class="bcp-progress-info">
                            <span>데이터 전송 중</span>
                            <span id="progressText">0%</span>
                        </div>
                        <div class="bcp-progress-track">
                            <div class="bcp-progress-fill" id="progressFill"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ══════════════════════════════════════════
                 Col 3 : 실행 제어 + 방송 이력
                 ══════════════════════════════════════════ -->
            <div class="bc-exec-col">

                <!-- 실행 제어 패널 -->
                <div class="bcp-panel bcp-panel--ctrl">
                    <div class="bcp-panel-band">
                        <div class="bcp-band-title">
                            <i class="bi bi-broadcast"></i>
                            <span>방송 실행 제어</span>
                        </div>
                    </div>
                    <div class="bcp-ctrl-body">
                        <!-- 음원 제어 -->
                        <div class="bcp-ctrl-row">
                            <div class="bcp-ctrl-lbl">
                                <i class="bi bi-music-note-beamed"></i> 음원 제어
                            </div>
                            <div class="bcp-bgm-btns">
                                <button class="bcp-bgm-btn bcp-bgm-on" id="broadcastBgmOnBtn"
                                    onclick="startBroadcastBgm()">
                                    <i class="bi bi-play-fill"></i><span>ON</span>
                                </button>
                                <button class="bcp-bgm-btn bcp-bgm-off" id="broadcastBgmOffBtn"
                                    onclick="stopBroadcastBgm()">
                                    <i class="bi bi-stop-fill"></i><span>OFF</span>
                                </button>
                            </div>
                        </div>
                        <!-- 방송 실행 -->
                        <div class="bcp-ctrl-row bcp-ctrl-launch">
                            <div class="bcp-ctrl-lbl">
                                <i class="bi bi-wifi"></i> 방송 실행
                            </div>
                            <button class="bcp-launch-btn bcp-launch-start" id="broadcastStartBtn"
                                onclick="startBroadcast()">
                                <i class="bi bi-play-circle-fill"></i>
                                <span>방송 시작</span>
                            </button>
                            <button class="bcp-launch-btn bcp-launch-stop d-none" id="broadcastStopBtn"
                                onclick="stopBroadcast()">
                                <i class="bi bi-stop-circle-fill"></i>
                                <span>방송 종료</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 방송 이력 패널 -->
                <div class="bcp-panel bcp-panel--log">
                    <div class="bcp-panel-band">
                        <div class="bcp-band-title">
                            <i class="bi bi-clock-history"></i>
                            <span>방송 이력</span>
                        </div>
                    </div>
                    <div class="bcp-log-scroll custom-scrollbar" id="broadcastLogSection">
                        <div id="broadcastLogEmpty" class="bcp-empty">
                            <i class="bi bi-clipboard-x"></i>
                            <p>오늘의 방송 이력이 없습니다.</p>
                        </div>
                        <div id="broadcastLogPanel" class="d-none bcp-log-list">
                            <!-- 로그 데이터 동적 삽입 -->
                        </div>
                    </div>
                </div>

            </div><!-- /bc-exec-col -->
        </div><!-- /bc-pipeline -->
    </div>
</div>
