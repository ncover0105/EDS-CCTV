<div th:fragment="speakerPane" style="display:flex; flex-direction:column; flex:1; min-height:0;">

    <div class="speaker-pane">

        <!-- Status Filter Toolbar -->
        <div class="speaker-toolbar">
            <button type="button" class="chip is-active" data-filter="all" onclick="filterSpeakers('all', this)">
                전체 <span class="badge bg-primary ms-1" id="chip-count-all">0</span>
            </button>
            <button type="button" class="chip" data-filter="ok" onclick="filterSpeakers('ok', this)">
                <span class="status-dot ok"></span> 정상
                <span class="badge bg-success ms-1" id="chip-count-ok">0</span>
            </button>
            <button type="button" class="chip" data-filter="warn" onclick="filterSpeakers('warn', this)">
                <span class="status-dot warn"></span> 점검중
                <span class="badge bg-warning ms-1" id="chip-count-warn">0</span>
            </button>
            <button type="button" class="chip" data-filter="bad" onclick="filterSpeakers('bad', this)">
                <span class="status-dot bad"></span> 오류
                <span class="badge bg-danger ms-1" id="chip-count-bad">0</span>
            </button>
            <button type="button" class="chip" data-filter="unknown" onclick="filterSpeakers('unknown', this)">
                <span class="status-dot unknown"></span> 오프라인
                <span class="badge bg-secondary ms-1" id="chip-count-unknown">0</span>
            </button>
        </div>

        <!-- Main grid: Table (left) + Inspector (right) -->
        <div class="speaker-layout">

            <!-- Left: Speaker Table Panel -->
            <section class="eq-panel">
                <header class="panel-header">
                    <div class="panel-title">
                        <i class="bi bi-speaker"></i>
                        <span>장비 네트워크</span>
                        <span class="badge bg-primary ms-1" id="speakerCount">0</span>
                    </div>
                    <div class="header-controls">
                        <div class="hud-search">
                            <i class="bi bi-search"></i>
                            <input id="speakerSearchInput" type="text" placeholder="ID / 이름 / 지역 검색" autocomplete="off">
                        </div>
                        <div class="panel-actions">
                            <button class="icon-btn" id="speakerAddBtn" type="button" title="추가">
                                <i class="bi bi-plus"></i>
                            </button>
                            <button class="icon-btn" id="speakerUpdateBtn" type="button" title="수정">
                                <i class="bi bi-pencil-square"></i>
                            </button>
                            <button class="icon-btn delete" id="speakerDeleteBtn" type="button" title="삭제">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                </header>

                <!-- Scrollable table body -->
                <div class="panel-body">
                    <div class="table-container speaker-table-wrap">
                        <table class="table-modern">
                            <thead>
                                <tr>
                                    <th style="width:44px;">선택</th>
                                    <th>ID</th>
                                    <th>단말명</th>
                                    <th>상태</th>
                                    <th>최종수신</th>
                                    <th>전화번호</th>
                                    <th>설치지역</th>
                                    <th style="width:80px;">위도</th>
                                    <th style="width:80px;">경도</th>
                                </tr>
                            </thead>
                            <tbody id="speakerTableBody"></tbody>
                        </table>
                    </div>
                </div>

                <footer class="panel-footer">
                    <ul class="pagination pagination-modern mb-0" id="speakerPagination"></ul>
                </footer>
            </section>

            <!-- Right: Inspector Column -->
            <div class="speaker-inspector-col">

                <!-- Device Info Card -->
                <section class="eq-panel" style="flex: 0 1 auto;">
                    <header class="panel-header">
                        <div class="panel-title">
                            <i class="bi bi-cpu"></i>
                            장비 점검
                        </div>
                    </header>
                    <div class="panel-body p-3" style="overflow-y: auto;">
                        <div class="inspector-device-name" id="selectedSpeakerTitle">장비를 선택하세요</div>
                        <div class="inspector-device-addr" id="selectedSpeakeraddress">-</div>

                        <div class="inspector-last-update">
                            <i class="bi bi-clock-history"></i>
                            <span>최근 업데이트</span>
                            <span style="margin-left:auto; font-family:var(--font-mono); font-size:11px;"
                                id="selectedSpeakerLastUpdate">-</span>
                        </div>

                        <div style="border-top:1px solid var(--border-subtle); margin-bottom: var(--sp-md);"></div>

                        <div class="quick-actions">
                            <button class="btn-cyber w-100" onclick="handleButtonClick(this, requestStatus)">
                                <i class="bi bi-info-circle"></i> 상태 요청
                            </button>
                            <button class="btn-cyber w-100" onclick="handleButtonClick(this, setTime)">
                                <i class="bi bi-clock"></i> 시간 설정
                            </button>
                            <button class="btn-cyber danger w-100" onclick="handleButtonClick(this, resetRequest)">
                                <i class="bi bi-bootstrap-reboot"></i> 시스템 리셋
                            </button>
                        </div>
                    </div>
                </section>

                <!-- Real-time Status Panel -->
                <section class="eq-panel" style="flex: 1.5; min-height: 0;">
                    <header class="panel-header">
                        <div class="panel-title">
                            <i class="bi bi-activity"></i>
                            실시간 상태 정보
                        </div>
                    </header>
                    <div class="monitor-grid" style="overflow-y: auto; flex: 1; min-height: 0;">
                        <div class="monitor-card">
                            <div class="monitor-label">네트워크</div>
                            <div class="monitor-value" id="connectionStatus">-</div>
                        </div>
                        <div class="monitor-card">
                            <div class="monitor-label">교류 전원(AC)</div>
                            <div class="monitor-value" id="acStatus">-</div>
                        </div>
                        <div class="monitor-card">
                            <div class="monitor-label">직류 전원(DC)</div>
                            <div class="monitor-value" id="dcStatus">-</div>
                        </div>
                        <div class="monitor-card">
                            <div class="monitor-label">배터리</div>
                            <div class="monitor-value" id="batteryStatus">-</div>
                        </div>
                        <div class="monitor-card">
                            <div class="monitor-label">태양광 충전</div>
                            <div class="monitor-value" id="solarChargerStatus">-</div>
                        </div>
                        <div class="monitor-card">
                            <div class="monitor-label">LTE 안테나</div>
                            <div class="monitor-value" id="lteAntennaStatus">-</div>
                        </div>
                        <div class="monitor-card">
                            <div class="monitor-label">온도</div>
                            <div class="monitor-value" id="cpuTemperature">-</div>
                        </div>
                        <div class="monitor-card">
                            <div class="monitor-label">펌웨어</div>
                            <div class="monitor-value" id="mcuVersion">-</div>
                        </div>
                    </div>
                </section>

            </div>
        </div>
    </div>

    <!-- Speaker Add Modal -->
    <div class="modal fade common-modal" id="speaker_add_modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="cm-header">
                    <div class="cm-title-wrap">
                        <i class="bi bi-megaphone cm-icon"></i>
                        <h5 class="cm-title">스피커 추가</h5>
                    </div>
                    <button type="button" class="cm-close" data-bs-dismiss="modal" aria-label="닫기">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>
                <div class="cm-body p-4">
                    <div class="row g-3">
                        <div class="col-md-6"><label class="eq-label">ID</label><input class="eq-input"
                                id="add_speakerId" placeholder="예: SPK-001"></div>
                        <div class="col-md-6"><label class="eq-label">단말명</label><input class="eq-input"
                                id="add_speakerName" placeholder="스피커 이름"></div>
                        <div class="col-md-6"><label class="eq-label">전화번호(CDMA)</label><input class="eq-input"
                                id="add_cdmaNumber"></div>
                        <div class="col-md-6"><label class="eq-label">위치</label><input class="eq-input"
                                id="add_locationName"></div>
                        <div class="col-12"><label class="eq-label">URL/IP</label><input class="eq-input"
                                id="add_speakerAdr" placeholder="예: http://... 또는 IP:PORT"></div>
                        <div class="col-md-6"><label class="eq-label">위도</label><input class="eq-input"
                                id="add_speakerLatitude"></div>
                        <div class="col-md-6"><label class="eq-label">경도</label><input class="eq-input"
                                id="add_speakerLongitude"></div>
                        <div class="col-12"><label class="eq-label">설명</label><textarea class="eq-input"
                                id="add_description"></textarea></div>
                    </div>
                </div>

                <div class="cm-footer">
                    <button class="cm-btn cm-btn-primary" type="button" id="btnSpeakerAddSave">등록</button>
                    <button class="cm-btn cm-btn-ghost" type="button" data-bs-dismiss="modal">닫기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Speaker Update Modal -->
    <div class="modal fade common-modal" id="speaker_update_modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="cm-header">
                    <div class="cm-title-wrap">
                        <i class="bi bi-pencil-square cm-icon"></i>
                        <h5 class="cm-title">장비 정보 수정</h5>
                    </div>
                    <button type="button" class="cm-close" data-bs-dismiss="modal" aria-label="닫기">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>
                <div class="cm-body p-4">
                    <input type="hidden" id="edit_speakerKey">
                    <div class="row g-3">
                        <div class="col-md-6"><label class="eq-label">ID</label><input class="eq-input"
                                id="edit_speakerId" readonly></div>
                        <div class="col-md-6"><label class="eq-label">단말명</label><input class="eq-input"
                                id="edit_speakerName"></div>
                        <div class="col-md-6"><label class="eq-label">전화번호(CDMA)</label><input class="eq-input"
                                id="edit_cdmaNumber"></div>
                        <div class="col-md-6"><label class="eq-label">위치</label><input class="eq-input"
                                id="edit_locationName"></div>
                        <div class="col-12"><label class="eq-label">URL/IP</label><input class="eq-input"
                                id="edit_speakerAdr"></div>
                        <div class="col-md-6"><label class="eq-label">위도</label><input class="eq-input"
                                id="edit_speakerLatitude"></div>
                        <div class="col-md-6"><label class="eq-label">경도</label><input class="eq-input"
                                id="edit_speakerLongitude"></div>
                        <div class="col-12"><label class="eq-label">설명</label><textarea class="eq-input"
                                id="edit_description"></textarea></div>
                    </div>
                </div>
                <div class="cm-footer">
                    <button class="cm-btn cm-btn-primary" type="button" id="btnSpeakerSave">수정</button>
                    <button class="cm-btn cm-btn-ghost" type="button" data-bs-dismiss="modal">닫기</button>
                </div>
            </div>
        </div>
    </div>

</div>
