<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>장비 관리</title>

  <link rel="stylesheet" th:href="@{/css/page/equipment_combined.css}" />

  <script defer src="/js/page/equipment/equipment2.js?v=1"></script>
  <script defer src="/js/page/equipment/equipment_cctv_pane.js?v=1"></script>
  <script defer src="/js/page/equipment/equipment_speaker_pane.js?v=1"></script>
  <script defer src="/js/page/equipment/equipment_broadcast_pane.js?v=1"></script>
  <script src="/js/ui/modal_tts_manage.js?v=1"></script>

</head>

<body>
  <div class="container-fluid p-0 d-flex flex-column" style="height:100vh; overflow:hidden;" layout:fragment="content">

    <!-- 스코프 시작: 모든 CSS는 .page-equipment 하위로만 적용 -->
    <div class="page-equipment">

      <!-- ══════════════════════════════════════
             Topbar (sticky, flex-shrink:0)
             ══════════════════════════════════════ -->
      <header class="eq-topbar">
        <div class="eq-topbar-content">
          <div class="eq-topbar-left">
            <!-- 모바일 사이드바 토글 -->
            <button type="button" class="eq-sidebar-toggle d-none" id="eqSidebarToggle" aria-label="메뉴 열기">
              <i class="bi bi-list"></i>
            </button>
            <h2 class="eq-page-title m-0">
              <i class="bi bi-grid-3x3-gap-fill"></i>
              장비 관리
            </h2>
          </div>
          <div class="eq-topbar-right d-none">
            <button type="button" class="eq-btn eq-btn-primary">
              <i class="bi bi-plus-lg"></i>
              <span>새 장비</span>
            </button>
            <button type="button" class="eq-btn eq-btn-secondary">
              <i class="bi bi-lightning-charge"></i>
              <span>빠른 실행</span>
            </button>
          </div>
        </div>

        <!-- 모바일 탭 네비게이션 (1024px 이하 표시) -->
        <nav class="eq-tab-nav" aria-label="장비관리 탭">
          <button class="eq-tab-item is-active" type="button" data-target="equipment-speaker-pane" aria-selected="true">
            <i class="bi bi-megaphone"></i> 스피커
          </button>
          <button class="eq-tab-item" type="button" data-target="equipment-broadcast-pane" aria-selected="false">
            <i class="bi bi-broadcast"></i> 방송
          </button>
          <button class="eq-tab-item" type="button" data-target="equipment-cctv-pane" aria-selected="false">
            <i class="bi bi-camera-video"></i> CCTV
          </button>
        </nav>
      </header>

      <!-- ══════════════════════════════════════
             Main Layout: Sidebar + Main
             min-height:0 이 없으면 flex overflow 미작동
             ══════════════════════════════════════ -->
      <div class="eq-layout">

        <!-- Sidebar (Desktop 기본 표시 / Mobile 오프캔버스) -->
        <aside class="eq-sidebar" id="eqSidebar" aria-label="장비관리 섹션">
          <div class="eq-sidebar-content">

            <nav class="eq-nav">
              <button class="eq-nav-item is-active" type="button" data-target="equipment-speaker-pane"
                aria-selected="true">
                <i class="bi bi-megaphone"></i>
                <span class="eq-nav-label">스피커</span>
              </button>
              <button class="eq-nav-item" type="button" data-target="equipment-broadcast-pane" aria-selected="false">
                <i class="bi bi-broadcast"></i>
                <span class="eq-nav-label">방송</span>
              </button>
              <button class="eq-nav-item" type="button" data-target="equipment-cctv-pane" aria-selected="false">
                <i class="bi bi-camera-video"></i>
                <span class="eq-nav-label">CCTV</span>
              </button>
            </nav>

            <div class="eq-sidebar-footer">
              <div class="eq-nav-toggle-hint" id="eqSidebarCollapse" role="button" tabindex="0"
                aria-label="사이드바 접기/펼치기">
                <i class="bi bi-chevron-left"></i>
                <span class="eq-nav-label">접기</span>
              </div>
            </div>

          </div>
        </aside>

        <!-- ══════════════════════════════════════
                 Main Content
                 각 pane이 flex column + height:100% 로 자체 overflow 관리
                 ══════════════════════════════════════ -->
        <main class="eq-main">

          <!-- Pane 1: Speaker -->
          <section class="eq-pane is-active" id="equipment-speaker-pane">
            <div th:replace="~{page/menu/equipment/equipment-speaker-pane :: speakerPane}"></div>
          </section>

          <!-- Pane 2: Broadcast -->
          <section class="eq-pane" id="equipment-broadcast-pane">
            <div th:replace="~{page/menu/equipment/equipment-broadcast-pane :: broadcastPane}"></div>
          </section>

          <!-- Pane 3: CCTV -->
          <section class="eq-pane" id="equipment-cctv-pane">
            <div th:replace="~{page/menu/equipment/equipment-cctv-pane :: cctvPane}"></div>
          </section>

        </main>
      </div>

      <!-- 모바일 사이드바 오버레이 -->
      <div class="eq-overlay" id="eqOverlay"></div>

    </div>
  </div>
</body>

</html>
