<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/layout}">

<head>
    <meta charset="UTF-8">
    <title th:text="${title}">안전재난프로그램</title>
    <link rel="stylesheet" href="css/cctv-placeholder.css">
    <style>
        .brand-hub {
            height: calc(100vh - 56px);
            padding: 18px;
            overflow: hidden;
            background:
                radial-gradient(circle at top left, rgba(34, 197, 94, 0.12), transparent 28%),
                radial-gradient(circle at top right, rgba(59, 130, 246, 0.14), transparent 32%),
                linear-gradient(180deg, rgba(11, 18, 32, 0.98), rgba(7, 12, 22, 1));
            color: #e5eefc;
            display: grid;
            grid-template-rows: auto auto minmax(0, 1fr);
            gap: 14px;
        }

        .brand-topbar {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 14px;
            align-items: center;
        }

        .brand-panel,
        .brand-mini-card,
        .brand-list-card {
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.015)),
                rgba(9, 14, 24, 0.92);
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.18);
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 10px;
            border-radius: 999px;
            background: rgba(59, 130, 246, 0.14);
            color: #bfdbfe;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .brand-title-block {
            padding: 18px 20px;
        }

        .brand-title {
            margin: 10px 0 4px;
            font-size: clamp(24px, 3vw, 34px);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.04em;
            color: #f8fbff;
        }

        .brand-subtitle {
            margin: 0;
            color: rgba(226, 232, 240, 0.68);
            font-size: 13px;
        }

        .brand-top-tools {
            display: grid;
            gap: 10px;
        }

        .brand-top-actions,
        .brand-top-modal-actions {
            display: flex;
            gap: 10px;
        }

        .brand-top-actions>.brand-link-btn,
        .brand-top-modal-actions>.brand-link-btn {
            flex: 1 1 0;
        }

        .brand-top-modal-actions {
            justify-content: flex-end;
        }

        .brand-link-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 40px;
            padding: 0 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            white-space: nowrap;
            transition: transform .18s ease, border-color .18s ease, background .18s ease;
        }

        .brand-link-btn.primary {
            background: linear-gradient(180deg, rgba(59, 130, 246, 0.22), rgba(59, 130, 246, 0.08));
            color: #eff6ff;
            border-color: rgba(96, 165, 250, 0.3);
        }

        .brand-link-btn.secondary {
            background: rgba(255, 255, 255, 0.04);
            color: #dbe7fb;
        }

        .brand-link-btn:hover {
            transform: translateY(-1px);
        }

        .brand-summary {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 14px;
        }

        .brand-mini-card {
            padding: 16px 18px;
        }

        .brand-mini-label,
        .brand-list-title {
            margin: 0;
            font-size: 13px;
            font-weight: 800;
            color: #f8fbff;
            letter-spacing: -0.02em;
        }

        .brand-mini-value {
            margin-top: 10px;
            font-size: 26px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.04em;
            color: #f8fbff;
        }

        .brand-content {
            display: grid;
            grid-template-columns: .95fr 1.2fr .9fr;
            gap: 14px;
            min-height: 0;
        }

        .brand-list-card {
            padding: 14px;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            min-height: 0;
        }

        .brand-right-stack {
            display: grid;
            grid-template-rows: minmax(340px, 1.25fr) minmax(240px, 0.75fr);
            gap: 14px;
            min-height: 0;
        }

        .brand-emergency-card {
            min-height: 0;
        }

        .brand-emergency-card .brand-list {
            align-content: start;
        }

        .brand-list-card.cctv-card {
            grid-template-rows: auto minmax(0, 1fr) auto;
        }

        .brand-list-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 0 2px 12px;
        }

        .brand-list-meta {
            font-size: 12px;
            color: rgba(191, 219, 254, 0.7);
        }

        .brand-list {
            display: grid;
            gap: 10px;
            min-height: 0;
            overflow-y: auto;
            padding-right: 4px;
        }

        .brand-list::-webkit-scrollbar,
        .brand-cctv-picker::-webkit-scrollbar {
            width: 8px;
        }

        .brand-list::-webkit-scrollbar-thumb,
        .brand-cctv-picker::-webkit-scrollbar-thumb {
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.28);
        }

        .brand-list-item {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr);
            align-items: center;
            gap: 10px;
            min-height: 0;
            min-height: 68px;
            padding: 16px 16px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .brand-list-button {
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: transform .18s ease, border-color .18s ease, background .18s ease;
        }

        .brand-list-button:hover {
            transform: translateY(-1px);
            border-color: rgba(96, 165, 250, 0.22);
            background: rgba(59, 130, 246, 0.08);
        }

        .brand-list-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(59, 130, 246, 0.12);
            color: #bfdbfe;
            font-size: 17px;
        }

        .brand-list-main {
            min-width: 0;
        }

        .brand-list-main strong {
            display: block;
            color: #f8fbff;
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
        }

        .brand-list-main span {
            display: block;
            margin-top: 5px;
            color: rgba(226, 232, 240, 0.62);
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
        }

        .brand-list-side {
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.05);
            color: rgba(226, 232, 240, 0.8);
            font-size: 11px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .brand-emergency-card .brand-list {
            gap: 10px;
        }

        .brand-emergency-item {
            gap: 10px;
            min-height: 92px;
            padding: 15px 16px;
            min-width: 0;
            overflow: hidden;
            border-radius: 18px;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.02)),
                rgba(16, 24, 39, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.04),
                0 10px 20px rgba(0, 0, 0, 0.14);
        }

        .brand-emergency-main {
            min-width: 0;
            display: grid;
            gap: 10px;
        }

        .brand-emergency-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-width: 0;
            width: 100%;
        }

        .brand-emergency-title {
            display: block;
            color: #f8fbff;
            font-size: 15px;
            font-weight: 800;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .brand-emergency-count {
            flex-shrink: 0;
            padding: 5px 10px;
            border-radius: 999px;
            background: rgba(239, 68, 68, 0.12);
            color: #fca5a5;
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
        }

        .brand-emergency-bar {
            position: relative;
            height: 12px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(2, 6, 23, 0.74);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .brand-emergency-bar-fill {
            position: absolute;
            inset: 0 auto 0 0;
            border-radius: inherit;
            min-width: 8px;
            background: linear-gradient(90deg, #fb7185, #f97316 58%, #facc15);
            box-shadow: 0 0 20px rgba(249, 115, 22, 0.18);
        }

        .brand-emergency-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            min-width: 0;
        }

        .brand-emergency-side-label {
            font-size: 11px;
            font-weight: 700;
            color: rgba(191, 219, 254, 0.62);
        }

        .brand-emergency-side-value {
            min-width: 0;
            color: rgba(226, 232, 240, 0.86);
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        .brand-cctv-view {
            display: grid;
            grid-template-rows: minmax(0, 1fr);
            min-height: 0;
        }

        .brand-cctv-screen {
            position: relative;
            min-height: 0;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background:
                radial-gradient(circle at 20% 20%, rgba(59, 130, 246, 0.18), transparent 35%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0)),
                rgba(4, 8, 16, 0.98);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 18px;
            gap: 10px;
        }

        .brand-cctv-screen::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(transparent 0, rgba(255, 255, 255, 0.035) 50%, transparent 100%);
            opacity: .28;
            pointer-events: none;
        }

        .brand-cctv-top {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }

        .brand-cctv-name {
            font-size: 18px;
            font-weight: 800;
            color: #f8fbff;
            letter-spacing: -0.03em;
        }

        .brand-cctv-sub {
            margin-top: 6px;
            font-size: 12px;
            color: rgba(226, 232, 240, 0.68);
        }

        .brand-cctv-status {
            padding: 5px 10px;
            border-radius: 999px;
            background: rgba(34, 197, 94, 0.16);
            color: #bbf7d0;
            font-size: 11px;
            font-weight: 800;
            white-space: nowrap;
        }

        .brand-cctv-center {
            position: relative;
            z-index: 1;
            min-height: 0;
            border-radius: 16px;
            overflow: hidden;
            background: rgba(2, 6, 14, 0.74);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .brand-cctv-stream-host,
        .brand-cctv-stream-host .cctv-grid,
        .brand-cctv-stream-host .cctv-feed {
            width: 100%;
            height: 100%;
        }

        .brand-cctv-stream-host .cctv-grid {
            padding: 0;
        }

        .brand-cctv-stream-host .cctv-feed {
            border-radius: 0;
        }

        .brand-cctv-stream-host .cctv-controls {
            display: none;
        }

        .brand-cctv-stream-host .cctv-label {
            left: 10px;
            right: 10px;
            bottom: 10px;
        }

        .brand-cctv-stream-host .cctv-name {
            font-size: 13px;
        }

        .brand-cctv-bottom {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
        }

        .brand-cctv-meta {
            padding: 10px 12px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .brand-cctv-meta strong {
            display: block;
            font-size: 11px;
            color: rgba(191, 219, 254, 0.72);
            margin-bottom: 6px;
        }

        .brand-cctv-meta span {
            display: block;
            font-size: 12px;
            color: #eff6ff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .brand-cctv-picker {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            margin-top: 12px;
            min-height: 0;
            max-height: 240px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .brand-cctv-option {
            min-height: 42px;
            padding: 8px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: #dbe7fb;
            font-size: 12px;
            font-weight: 700;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: border-color .18s ease, background .18s ease, transform .18s ease;
        }

        .brand-cctv-option:hover,
        .brand-cctv-option.is-active {
            border-color: rgba(96, 165, 250, 0.28);
            background: rgba(59, 130, 246, 0.10);
            transform: translateY(-1px);
        }

        .brand-quick-links {
            display: grid;
            gap: 10px;
        }

        .brand-quick-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 14px;
            text-decoration: none;
            color: inherit;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .brand-quick-link strong {
            display: block;
            font-size: 13px;
            color: #f8fbff;
        }

        .brand-quick-link span {
            display: block;
            margin-top: 3px;
            font-size: 11px;
            color: rgba(226, 232, 240, 0.62);
        }

        @media (max-width: 1440px),
        (max-height: 860px) {
            .brand-hub {
                overflow-y: auto;
                height: auto;
            }

            .brand-summary {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .brand-content {
                grid-template-columns: 1fr;
            }

            .brand-right-stack {
                grid-template-rows: auto auto;
            }

            .brand-cctv-picker {
                max-height: 220px;
            }
        }

        @media (max-width: 900px) {
            .brand-topbar {
                grid-template-columns: 1fr;
            }

            .brand-summary {
                grid-template-columns: 1fr;
            }

            .brand-top-actions,
            .brand-top-modal-actions {
                flex-wrap: wrap;
            }

            .brand-cctv-bottom {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <script src="/js/ui/modal_speaker_setting.js?v=1"></script>
    <script src="/js/ui/modal_speaker_broadcast.js?v=1"></script>
</head>

<body>
    <div layout:fragment="content">
        <main class="brand-hub">
            <section class="brand-topbar">
                <div class="brand-panel brand-title-block">
                    <div class="brand-badge"><i class="bi bi-shield-check"></i> Safety</div>
                    <h1 class="brand-title">안전 재난 관리 시스템</h1>
                    <p class="brand-subtitle">스피커 · CCTV · 출입기록</p>
                </div>
                <div class="brand-top-tools">
                    <div class="brand-top-actions">
                        <a class="brand-link-btn primary" th:href="@{/menu/equipment2}">
                            <i class="bi bi-sliders"></i> 장비관리
                        </a>
                        <a class="brand-link-btn secondary" th:href="@{/main}">
                            <i class="bi bi-grid-1x2"></i> 상황판
                        </a>
                    </div>
                    <div class="brand-top-modal-actions">
                        <button type="button" class="brand-link-btn secondary" data-bs-toggle="modal"
                            data-bs-target="#speaker_setting_modal">
                            <i class="bi bi-speaker-fill"></i> 스피커 설정
                        </button>
                        <button type="button" class="brand-link-btn primary" data-bs-toggle="modal"
                            data-bs-target="#speaker_broadcast_modal">
                            <i class="bi bi-broadcast-pin"></i> 수동 방송
                        </button>
                    </div>
                </div>
            </section>

            <section class="brand-summary">
                <div class="brand-mini-card">
                    <div class="brand-mini-label">스피커</div>
                    <div class="brand-mini-value" id="brandSpeakerCount">0</div>
                </div>
                <div class="brand-mini-card">
                    <div class="brand-mini-label">CCTV</div>
                    <div class="brand-mini-value" id="brandCctvCount">0</div>
                </div>
                <div class="brand-mini-card">
                    <div class="brand-mini-label">출입기록</div>
                    <div class="brand-mini-value" id="brandEmergencyCount">0</div>
                </div>
                <div class="brand-mini-card">
                    <div class="brand-mini-label">방송이력</div>
                    <div class="brand-mini-value" id="brandBroadcastCount">0</div>
                </div>
            </section>

            <section class="brand-content">
                <div class="brand-list-card">
                    <div class="brand-list-head">
                        <h2 class="brand-list-title">스피커 리스트</h2>
                        <div class="brand-list-meta" id="brandSpeakerListCount">0 대</div>
                    </div>
                    <div class="brand-list" id="brandSpeakerList">
                        <div class="brand-list-item">
                            <div class="brand-list-icon"><i class="bi bi-megaphone-fill"></i></div>
                            <div class="brand-list-main">
                                <strong>로딩 중</strong>
                                <span>스피커 목록</span>
                            </div>
                            <div class="brand-list-side">-</div>
                        </div>
                    </div>
                </div>

                <div class="brand-list-card cctv-card">
                    <div class="brand-list-head">
                        <h2 class="brand-list-title">CCTV 영역</h2>
                        <div class="brand-list-meta" id="brandCctvListCount">0 채널</div>
                    </div>
                    <div class="brand-cctv-view">
                        <div class="brand-cctv-screen">
                            <div class="brand-cctv-top">
                                <div>
                                    <div class="brand-cctv-name" id="brandSelectedCctvName">CCTV 미선택</div>
                                    <div class="brand-cctv-sub" id="brandSelectedCctvAddress">-</div>
                                </div>
                                <div class="brand-cctv-status" id="brandSelectedCctvStatus">확인</div>
                            </div>
                            <div class="brand-cctv-center">
                                <div id="cctv-container" class="brand-cctv-stream-host"></div>
                            </div>
                            <div class="brand-cctv-bottom">
                                <div class="brand-cctv-meta">
                                    <strong>코드</strong>
                                    <span id="brandSelectedCctvCode">-</span>
                                </div>
                                <div class="brand-cctv-meta">
                                    <strong>포트</strong>
                                    <span id="brandSelectedCctvPort">-</span>
                                </div>
                                <div class="brand-cctv-meta">
                                    <strong>좌표</strong>
                                    <span id="brandSelectedCctvCoord">-</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="brand-cctv-picker" id="brandCctvPicker">
                        <button type="button" class="brand-cctv-option is-active">로딩 중</button>
                    </div>
                </div>

                <div class="brand-right-stack">
                    <div class="brand-list-card brand-emergency-card">
                        <div class="brand-list-head">
                            <h2 class="brand-list-title">출입기록</h2>
                            <div class="brand-list-meta" id="brandEmergencyListCount">0 건</div>
                        </div>
                        <div class="brand-list" id="brandEmergencyList">
                            <div class="brand-list-item brand-emergency-item">
                                <div class="brand-emergency-main">
                                    <div class="brand-emergency-head">
                                        <strong class="brand-emergency-title">1번 구역</strong>
                                        <span class="brand-emergency-count">0건</span>
                                    </div>
                                    <div class="brand-emergency-bar">
                                        <div class="brand-emergency-bar-fill" style="width: 0%;"></div>
                                    </div>
                                    <div class="brand-emergency-foot">
                                        <span class="brand-emergency-side-label">오늘 기준</span>
                                        <span class="brand-emergency-side-value">0 / 100건</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="brand-list-card">
                        <div class="brand-list-head">
                            <h2 class="brand-list-title">방송이력</h2>
                            <div class="brand-list-meta" id="brandBroadcastListCount">0 건</div>
                        </div>
                        <div class="brand-list" id="brandBroadcastList">
                            <div class="brand-list-item">
                                <div class="brand-list-icon"><i class="bi bi-broadcast-pin"></i></div>
                                <div class="brand-list-main">
                                    <strong>로딩 중</strong>
                                    <span>방송이력</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>
        <script th:src="@{/js/module/janus.js}"></script>
        <script th:src="@{/js/module/cctv_layout.js}"></script>
        <script th:src="@{/js/module/cctv_janus.js}"></script>
        <script th:src="@{/js/page/brand_hub_page.js}"></script>
    </div>
</body>

</html>
