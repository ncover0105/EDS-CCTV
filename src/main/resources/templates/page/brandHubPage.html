<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/layout}">

<head>
    <meta charset="UTF-8">
    <title th:text="${title}">안전재난프로그램</title>
    <link rel="stylesheet" href="css/cctv-placeholder.css">
    <style>
        /* ── 디자인 토큰 ─────────────────────────────────── */
        :root {
            --bg:          #06090f;
            --bg-card:     #0d1521;
            --border:      rgba(255, 255, 255, 0.08);
            --border-dim:  rgba(255, 255, 255, 0.05);
            --txt:         #e2e8f0;
            --txt-muted:   #475569;
            --txt-dim:     #334155;
            --accent:      #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.2);
            --danger:      #ef4444;
            --danger-bg:   rgba(239, 68, 68, 0.12);
            --safe:        #22c55e;
            --r:           10px;
        }

        /* ── 전체 레이아웃 ───────────────────────────────── */
        .ops-dash {
            height: calc(100vh - 56px);
            display: grid;
            grid-template-rows: 44px 1fr 40px;
            background: var(--bg);
            color: var(--txt);
            overflow: hidden;
            font-size: 12px;
        }

        /* ── 헤더 ────────────────────────────────────────── */
        .ops-hd {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 14px;
            border-bottom: 1px solid var(--border-dim);
            background: rgba(255, 255, 255, 0.02);
            overflow: hidden;
        }

        .ops-hd-status {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            overflow: hidden;
            min-width: 0;
        }

        .ops-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--txt-muted);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .ops-chip strong { color: var(--txt); }

        .ops-chip--warn {
            background: var(--danger-bg);
            border-color: rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .ops-chip--warn strong { color: #fca5a5; }

        .ops-hd-actions {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }

        .ops-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            height: 30px;
            padding: 0 11px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            text-decoration: none;
            transition: background .15s, transform .1s;
        }

        .ops-btn--ghost {
            background: rgba(255, 255, 255, 0.04);
            color: var(--txt-muted);
        }

        .ops-btn--ghost:hover {
            background: rgba(255, 255, 255, 0.09);
            color: var(--txt);
        }

        .ops-btn--urgent {
            background: linear-gradient(135deg, #dc2626, #c2410c);
            color: #fff;
            border-color: rgba(239, 68, 68, 0.4);
            box-shadow: 0 0 12px rgba(220, 38, 38, 0.28);
            animation: urgentPulse 2.5s ease-in-out infinite;
        }

        .ops-btn--urgent:hover { transform: translateY(-1px); }

        @keyframes urgentPulse {
            0%, 100% { box-shadow: 0 0 12px rgba(220, 38, 38, 0.28); }
            50%       { box-shadow: 0 0 22px rgba(220, 38, 38, 0.6); }
        }

        /* ── 메인 2-컬럼 ─────────────────────────────────── */
        .ops-body {
            display: grid;
            grid-template-columns: 3fr 2fr;
            min-height: 0;
            overflow: hidden;
        }

        /* ── CCTV 컬럼 ───────────────────────────────────── */
        .ops-cctv-col {
            display: grid;
            grid-template-rows: 1fr 72px auto;
            min-height: 0;
            border-right: 1px solid var(--border-dim);
        }

        .ops-cctv-view {
            min-height: 0;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        /* CCTVLayout 스코프 오버라이드 */
        .ops-cctv-view .cctv-grid     { width: 100%; height: 100%; padding: 0; }
        .ops-cctv-view .cctv-feed     { width: 100%; height: 100%; border-radius: 0; }
        .ops-cctv-view .cctv-controls { display: none; }
        .ops-cctv-view .cctv-label    { left: 10px; right: 10px; bottom: 10px; }
        .ops-cctv-view .cctv-name     { font-size: 13px; }

        /* 통계 차트 행 */
        .ops-cctv-info {
            display: grid;
            grid-template-columns: 130px 1fr;
            align-items: center;
            gap: 12px;
            padding: 5px 14px 5px 10px;
            border-top: 1px solid var(--border-dim);
            background: rgba(255, 255, 255, 0.012);
        }

        .ops-cs-pills {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .ops-cs-pill {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .ops-cs-val {
            font-size: 16px;
            font-weight: 800;
            color: var(--txt);
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        .ops-cs-lbl {
            font-size: 10px;
            color: var(--txt-muted);
        }

        .ops-cs-chart-wrap {
            display: flex;
            flex-direction: column;
            gap: 2px;
            height: 100%;
            padding: 4px 0 3px;
        }

        .ops-cs-chart {
            display: flex;
            align-items: flex-end;
            gap: 1px;
            flex: 1;
            min-width: 0;
        }

        .ops-cs-bar {
            flex: 1;
            min-width: 1px;
            border-radius: 2px 2px 0 0;
            background: rgba(59, 130, 246, 0.25);
            min-height: 1px;
            transition: height .3s ease;
        }

        .ops-cs-bar.is-now { background: rgba(96, 165, 250, 0.75); }
        .ops-cs-bar.is-hot { background: rgba(249, 115, 22, 0.6); }

        .ops-cs-labels {
            display: flex;
            justify-content: space-between;
        }

        .ops-cs-labels span {
            font-size: 9px;
            color: var(--txt-dim);
        }

        /* 카메라 탭 바 */
        .ops-cam-rail {
            display: flex;
            gap: 5px;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.018);
            border-top: 1px solid var(--border-dim);
            overflow-x: auto;
            flex-shrink: 0;
            scrollbar-width: thin;
            scrollbar-color: rgba(148, 163, 184, 0.2) transparent;
        }

        .ops-cam-rail::-webkit-scrollbar       { height: 3px; }
        .ops-cam-rail::-webkit-scrollbar-thumb { border-radius: 999px; background: rgba(148, 163, 184, 0.2); }

        .ops-cam-tab {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            height: 26px;
            padding: 0 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            color: var(--txt-muted);
            cursor: pointer;
            white-space: nowrap;
            transition: background .15s, border-color .15s, color .15s;
        }

        .ops-cam-tab::before {
            content: "";
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--txt-dim);
            flex-shrink: 0;
        }

        .ops-cam-tab[data-ok="1"]::before { background: var(--safe); }
        .ops-cam-tab[data-ok="0"]::before { background: var(--danger); }

        .ops-cam-tab.is-active,
        .ops-cam-tab:hover {
            background: var(--accent-glow);
            border-color: rgba(96, 165, 250, 0.35);
            color: #eff6ff;
        }

        /* ── 사이드 컬럼 ─────────────────────────────────── */
        .ops-side-col {
            display: grid;
            grid-template-rows: 1fr 152px 120px;
            min-height: 0;
            overflow: hidden;
            padding: 6px;
            gap: 5px;
            background: var(--bg);
        }

        /* 공통 카드 */
        .ops-card {
            display: grid;
            grid-template-rows: 34px 1fr;
            min-height: 0;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--r);
            overflow: hidden;
        }

        .ops-card-hd {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            border-bottom: 1px solid var(--border-dim);
            flex-shrink: 0;
        }

        .ops-card-title {
            font-size: 10px;
            font-weight: 800;
            color: var(--txt-muted);
            text-transform: uppercase;
            letter-spacing: 0.07em;
        }

        .ops-badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 800;
        }

        .ops-badge--alert {
            background: var(--danger-bg);
            color: #fca5a5;
        }

        .ops-meta {
            font-size: 11px;
            color: var(--txt-dim);
        }

        /* 이벤트 리스트 */
        .ops-event-body {
            overflow-y: auto;
            min-height: 0;
            padding: 5px 8px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            scrollbar-width: thin;
            scrollbar-color: rgba(148, 163, 184, 0.15) transparent;
        }

        .ops-event-body::-webkit-scrollbar       { width: 3px; }
        .ops-event-body::-webkit-scrollbar-thumb { border-radius: 999px; background: rgba(148, 163, 184, 0.15); }

        .ops-ev {
            display: grid;
            grid-template-columns: 32px 1fr;
            align-items: center;
            gap: 8px;
            padding: 6px 9px;
            border-radius: 7px;
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid var(--border-dim);
            flex-shrink: 0;
        }

        .ops-ev--new { animation: evFlash 1.4s ease-out forwards; }

        @keyframes evFlash {
            0%   { background: rgba(239, 68, 68, 0.18); border-color: rgba(239, 68, 68, 0.36); }
            100% { background: rgba(255, 255, 255, 0.025); border-color: var(--border-dim); }
        }

        .ops-ev-t {
            font-size: 11px;
            font-weight: 800;
            color: var(--txt-muted);
            font-variant-numeric: tabular-nums;
            text-align: center;
            line-height: 1.25;
        }

        .ops-ev-info { min-width: 0; }

        .ops-ev-row {
            display: flex;
            align-items: center;
            gap: 5px;
            min-width: 0;
        }

        .ops-ev-zone {
            font-size: 12px;
            font-weight: 800;
            color: #f1f5f9;
            white-space: nowrap;
        }

        .ops-ev-type {
            padding: 1px 6px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 700;
            background: var(--danger-bg);
            color: #fca5a5;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .ops-ev-cam {
            display: block;
            margin-top: 1px;
            font-size: 10px;
            color: var(--txt-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 구역 도넛 차트 */
        .ops-donut-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 4px 12px;
            min-height: 0;
        }

        .ops-donut-ring {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            flex-shrink: 0;
            position: relative;
        }

        .ops-donut-ring::after {
            content: '';
            position: absolute;
            inset: 21px;
            border-radius: 50%;
            background: var(--bg-card);
        }

        .ops-donut-legend {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .ops-donut-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            color: var(--txt-muted);
            white-space: nowrap;
            min-width: 86px;
        }

        .ops-donut-dot {
            width: 8px;
            height: 8px;
            border-radius: 2px;
            flex-shrink: 0;
        }

        .ops-donut-item strong {
            font-weight: 800;
            color: #94a3b8;
            margin-left: auto;
            padding-left: 4px;
        }

        /* 스피커 상태 */
        .ops-spk-body {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 6px 10px;
            align-content: flex-start;
            overflow: hidden;
            min-height: 0;
        }

        .ops-spk-dot {
            width: 30px;
            height: 30px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 800;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
            color: var(--txt-dim);
            cursor: default;
        }

        .ops-spk-dot[data-status="on"] {
            background: rgba(34, 197, 94, 0.1);
            border-color: rgba(74, 222, 128, 0.25);
            color: #86efac;
        }

        .ops-spk-dot[data-status="off"] {
            background: rgba(239, 68, 68, 0.09);
            border-color: rgba(248, 113, 113, 0.2);
            color: #fca5a5;
        }

        /* ── 하단 상태바 ─────────────────────────────────── */
        .ops-ft {
            display: flex;
            align-items: center;
            padding: 0 14px;
            border-top: 1px solid var(--border-dim);
            background: rgba(255, 255, 255, 0.012);
            overflow: hidden;
        }

        .ops-ft-stats {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }

        .ops-ft-stat {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            color: var(--txt-dim);
            white-space: nowrap;
        }

        .ops-ft-stat i        { font-size: 11px; }
        .ops-ft-stat strong   { font-size: 13px; font-weight: 800; color: #cbd5e1; }
        .ops-ft-stat--alert i,
        .ops-ft-stat--alert   { color: #f87171; }
        .ops-ft-stat--alert strong { color: #fca5a5; }

        .ops-ft-sep {
            width: 1px;
            height: 16px;
            background: var(--border-dim);
            margin: 0 12px;
            flex-shrink: 0;
        }

        .ops-ft-bc {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            overflow: hidden;
        }

        .ops-bc-entry {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            color: var(--txt-dim);
            white-space: nowrap;
        }

        .ops-bc-entry i    { color: var(--accent); font-size: 11px; }
        .ops-bc-entry span { color: var(--txt-muted); }

        /* ── 반응형 ──────────────────────────────────────── */
        @media (max-width: 1200px) {
            .ops-body     { grid-template-columns: 3fr 2fr; }
            .ops-side-col { grid-template-rows: 1fr 140px 110px; }
        }

        @media (max-width: 900px) {
            .ops-dash {
                height: auto;
                overflow-y: auto;
                grid-template-rows: 44px auto 40px;
            }
            .ops-body        { grid-template-columns: 1fr; }
            .ops-cctv-col    { height: 50vw; min-height: 260px; }
            .ops-side-col    { grid-template-rows: 280px 140px 110px; }
            .ops-cctv-info   { display: none; }
            .ops-ft-bc       { display: none; }
        }
    </style>
    <script src="/js/ui/modal_speaker_setting.js?v=1"></script>
    <script src="/js/ui/modal_speaker_broadcast.js?v=1"></script>
</head>

<body>
    <div layout:fragment="content">
        <main class="ops-dash">

            <!-- 헤더: 운영 상태 + 액션 -->
            <header class="ops-hd">
                <div class="ops-hd-status">
                    <span class="ops-chip">
                        <i class="bi bi-exclamation-circle"></i>
                        이벤트 <strong id="opsShiftEventCount">0</strong>건
                    </span>
                    <span class="ops-chip ops-chip--warn" id="opsChipCctvOff" style="display:none">
                        <i class="bi bi-camera-video-off-fill"></i>
                        CCTV오프 <strong id="opsShiftCctvOff">0</strong>대
                    </span>
                    <span class="ops-chip ops-chip--warn" id="opsChipSpkOff" style="display:none">
                        <i class="bi bi-speaker-fill"></i>
                        스피커오프 <strong id="opsShiftSpkOff">0</strong>대
                    </span>
                </div>
                <div class="ops-hd-actions">
                    <button type="button" class="ops-btn ops-btn--urgent"
                            data-bs-toggle="modal" data-bs-target="#speaker_broadcast_modal">
                        <i class="bi bi-broadcast-pin"></i> 긴급방송
                    </button>
                    <button type="button" class="ops-btn ops-btn--ghost"
                            data-bs-toggle="modal" data-bs-target="#speaker_setting_modal">
                        <i class="bi bi-sliders"></i>
                    </button>
                    <a class="ops-btn ops-btn--ghost" th:href="@{/menu/equipment2}" title="장비관리">
                        <i class="bi bi-tools"></i>
                    </a>
                    <a class="ops-btn ops-btn--ghost" th:href="@{/main}" title="상황판">
                        <i class="bi bi-grid-1x2"></i>
                    </a>
                </div>
            </header>

            <!-- 메인 -->
            <div class="ops-body">

                <!-- CCTV 컬럼 -->
                <section class="ops-cctv-col">
                    <div id="cctv-container" class="ops-cctv-view"></div>

                    <!-- 통계 요약 + 24시간 이벤트 히트맵 -->
                    <div class="ops-cctv-info">
                        <div class="ops-cs-pills">
                            <div class="ops-cs-pill">
                                <span class="ops-cs-val" id="opsCsSumTotal">0</span>
                                <span class="ops-cs-lbl">오늘 이벤트</span>
                            </div>
                            <div class="ops-cs-pill">
                                <span class="ops-cs-val" id="opsCsSumPeak">-</span>
                                <span class="ops-cs-lbl">피크</span>
                            </div>
                            <div class="ops-cs-pill">
                                <span class="ops-cs-val" id="opsCsSumZone">-</span>
                                <span class="ops-cs-lbl">주요구역</span>
                            </div>
                        </div>
                        <div class="ops-cs-chart-wrap">
                            <div class="ops-cs-chart" id="opsCctvHourly"></div>
                            <div class="ops-cs-labels">
                                <span>0시</span><span>6시</span><span>12시</span><span>18시</span><span>23시</span>
                            </div>
                        </div>
                    </div>

                    <!-- 카메라 탭 바 -->
                    <nav class="ops-cam-rail" id="brandCctvPicker">
                        <button type="button" class="ops-cam-tab is-active">로딩 중</button>
                    </nav>
                </section>

                <!-- 사이드 컬럼 -->
                <aside class="ops-side-col">

                    <!-- 이벤트 카드 -->
                    <div class="ops-card">
                        <div class="ops-card-hd">
                            <span class="ops-card-title">실시간 이벤트</span>
                            <span class="ops-badge ops-badge--alert" id="brandEmergencyListCount">0건</span>
                        </div>
                        <div class="ops-event-body" id="brandEmergencyList"></div>
                    </div>

                    <!-- 구역 현황 카드 -->
                    <div class="ops-card">
                        <div class="ops-card-hd">
                            <span class="ops-card-title">구역별 현황</span>
                            <span class="ops-meta" id="brandEmergencyCount">오늘 0건</span>
                        </div>
                        <div class="ops-donut-area" id="opsZoneBars"></div>
                    </div>

                    <!-- 스피커 카드 -->
                    <div class="ops-card">
                        <div class="ops-card-hd">
                            <span class="ops-card-title">스피커</span>
                            <span class="ops-meta" id="brandSpeakerListCount">0대</span>
                        </div>
                        <div class="ops-spk-body" id="brandSpeakerList"></div>
                    </div>

                </aside>
            </div>

            <!-- 하단 상태바 -->
            <footer class="ops-ft">
                <div class="ops-ft-stats">
                    <div class="ops-ft-stat">
                        <i class="bi bi-megaphone-fill"></i>
                        <strong id="brandSpeakerCount">0</strong>
                        <span>스피커</span>
                    </div>
                    <div class="ops-ft-stat">
                        <i class="bi bi-camera-video-fill"></i>
                        <strong id="brandCctvCount">0</strong>
                        <span>CCTV</span>
                    </div>
                    <div class="ops-ft-stat ops-ft-stat--alert">
                        <i class="bi bi-exclamation-circle-fill"></i>
                        <strong id="opsEmergencyFt">0</strong>
                        <span>이벤트</span>
                    </div>
                    <div class="ops-ft-stat">
                        <i class="bi bi-soundwave"></i>
                        <strong id="brandBroadcastCount">0</strong>
                        <span>방송</span>
                    </div>
                </div>
                <div class="ops-ft-sep"></div>
                <div class="ops-ft-bc" id="brandBroadcastList"></div>
            </footer>

        </main>

        <!-- 하위 호환 숨김 ID -->
        <span id="brandCctvListCount"      style="display:none"></span>
        <span id="brandBroadcastListCount" style="display:none"></span>

        <script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>
        <script th:src="@{/js/module/janus.js}"></script>
        <script th:src="@{/js/module/cctv_layout.js}"></script>
        <script th:src="@{/js/module/cctv_janus.js}"></script>
        <script th:src="@{/js/page/brand_hub_page.js}"></script>
    </div>
</body>

</html>
