<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/layout}">

<head>
    <meta charset="UTF-8">
    <title th:text="${title}">안전재난프로그램</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.4.0/ol.css" />
    <script src="https://cdn.jsdelivr.net/npm/ol@7.4.0/dist/ol.js"></script>

    <link rel="stylesheet" th:href="@{/css/map.css}" />

    <script th:inline="javascript">
        /*<![CDATA[*/
        var mapApiKey = /*[[${mapApiKey}]]*/ "";
        /*]]>*/
    </script>

    <style>
        :root {
            --bg: #06090f;
            --bg-card: #0d1521;
            --bg-card-2: #101827;
            --border: rgba(255, 255, 255, 0.08);
            --border-dim: rgba(255, 255, 255, 0.05);
            --txt: #e2e8f0;
            --txt-muted: #94a3b8;
            --txt-dim: #64748b;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.18);
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.12);
            --safe: #22c55e;
            --hub-body-gap: 16px;
            --hub-map-height-xl: 760px;
        }

        .map-hub {
            height: calc(100vh - 56px);
            overflow: hidden;
            background:
                radial-gradient(circle at top left, rgba(59, 130, 246, 0.12), transparent 24%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0)),
                var(--bg);
            color: var(--txt);
            font-size: 12px;
        }

        .hub-shell {
            height: 100%;
            min-height: 0;
            padding-bottom: 12px;
            box-sizing: border-box;
        }

        /* .hub-toolbar {
            border-bottom: 1px solid var(--border-dim);
            background: rgba(255, 255, 255, 0.02);
        } */

        .hub-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 44px;
            padding: 0 14px;
        }

        .hub-bar-status {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1 1 auto;
            flex-wrap: wrap;
            min-width: 0;
        }

        .hub-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.05);
            color: var(--txt-muted);
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        .hub-chip strong {
            color: var(--txt);
        }

        .hub-chip--warn {
            background: var(--danger-bg);
            border-color: rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .hub-chip--warn strong {
            color: #fca5a5;
        }

        .hub-bar-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 5px;
        }

        .hub-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            min-height: 30px;
            padding: 0 11px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 11px;
            font-weight: 700;
            text-decoration: none;
            white-space: nowrap;
            transition: background .15s, transform .1s, border-color .15s;
        }

        .hub-btn--ghost {
            background: rgba(255, 255, 255, 0.04);
            color: var(--txt-muted);
        }

        .hub-btn--ghost:hover {
            background: rgba(255, 255, 255, 0.09);
            color: var(--txt);
        }

        .hub-btn--urgent {
            background: linear-gradient(135deg, #dc2626, #c2410c);
            color: #fff;
            border-color: rgba(239, 68, 68, 0.4);
            box-shadow: 0 0 8px rgba(220, 38, 38, 0.2);
        }

        .hub-btn--urgent:hover {
            transform: translateY(-1px);
        }

        .hub-btn--urgent.has-event {
            box-shadow: 0 0 12px rgba(220, 38, 38, 0.45);
            animation: urgentPulse 2.5s ease-in-out infinite;
        }

        @keyframes urgentPulse {

            0%,
            100% {
                box-shadow: 0 0 12px rgba(220, 38, 38, 0.28);
            }

            50% {
                box-shadow: 0 0 22px rgba(220, 38, 38, 0.6);
            }
        }

        .hub-body {
            flex: 1 1 auto;
            min-height: 0;
            --bs-gutter-x: var(--hub-body-gap);
            --bs-gutter-y: var(--hub-body-gap);
            padding-bottom: 10px;
        }

        .hub-map-section,
        .hub-panel {
            min-height: 0;
        }

        .hub-map-card {
            position: relative;
            min-height: 0;
            height: 100%;
            overflow: hidden;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 22px 42px rgba(0, 0, 0, 0.28);
        }

        .hub-map-actions {
            position: absolute;
            top: 14px;
            right: 14px;
            z-index: 30;
            display: flex;
            gap: 8px;
        }

        .hub-map-legend {
            position: absolute;
            left: 14px;
            bottom: 14px;
            z-index: 28;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 172px;
            padding: 12px 13px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(6, 9, 15, 0.82);
            box-shadow: 0 16px 34px rgba(0, 0, 0, 0.34);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .hub-map-legend-title {
            margin: 0;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #cbd5e1;
        }

        .hub-map-legend-list {
            display: grid;
            gap: 8px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .hub-map-legend-item {
            display: grid;
            grid-template-columns: 12px minmax(0, 1fr);
            align-items: center;
            gap: 8px;
        }

        .hub-map-legend-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--txt-muted);
            line-height: 1.3;
        }

        .hub-map-legend-chip {
            width: 10px;
            height: 10px;
            border-radius: 999px;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.18);
        }

        .hub-map-legend-chip.is-normal {
            background: #378add;
        }

        .hub-map-legend-chip.is-offline {
            background: #a32d2d;
        }

        .hub-map-actions .css-action-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(6, 9, 15, 0.82);
            color: #f8fafc;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .hub-map-actions .css-action-btn:hover {
            background: rgba(59, 130, 246, 0.18);
            border-color: rgba(96, 165, 250, 0.45);
            color: #ffffff;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.42);
        }

        .hub-map-actions .css-action-btn i {
            font-size: 15px;
        }

        #map {
            position: absolute;
            inset: 0;
        }

        #mapTooltip {
            position: absolute;
            z-index: 120;
            pointer-events: none;
        }

        .cctv-mini-popup {
            position: absolute;
            z-index: 200;
            width: min(360px, calc(100vw - 32px));
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.13);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.04);
            transform: translate(-50%, calc(-100% - 18px));
            pointer-events: auto;
        }

        .cctv-mini-popup::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 8px solid var(--bg-card);
        }

        .cctv-mini-popup-hd {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 10px 7px;
            border-bottom: 1px solid var(--border-dim);
        }

        .cctv-mini-popup-title-area {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }

        .cctv-mini-popup-status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
            background: var(--txt-dim);
        }

        .cctv-mini-popup-status-dot.is-online {
            background: var(--safe);
        }

        .cctv-mini-popup-status-dot.is-offline {
            background: var(--danger);
        }

        .cctv-mini-popup-name {
            font-size: 12px;
            font-weight: 800;
            color: var(--txt);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cctv-mini-popup-close {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border-radius: 7px;
            border: none;
            background: rgba(255, 255, 255, 0.06);
            color: var(--txt-muted);
            cursor: pointer;
            flex-shrink: 0;
            transition: background .15s;
        }

        .cctv-mini-popup-close:hover {
            background: rgba(255, 255, 255, 0.12);
            color: var(--txt);
        }

        .cctv-mini-popup-close i {
            font-size: 14px;
            line-height: 1;
        }

        .cctv-mini-popup-video-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            overflow: hidden;
        }

        .cctv-mini-popup-video-wrap video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .cctv-mini-popup-loading,
        .cctv-mini-popup-error {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 11px;
            color: var(--txt-muted);
        }

        .cctv-mini-popup-loading {
            background: linear-gradient(180deg, rgba(4, 6, 10, 0.78), rgba(4, 6, 10, 0.9));
            text-align: center;
        }

        .cctv-mini-popup-loading-message {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .cctv-mini-popup-loading .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            display: inline-block;
            flex-shrink: 0;
        }

        .cctv-mini-popup-loading .status-dot.ok {
            background: #22c55e;
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.14);
        }

        .cctv-mini-popup-loading .status-dot.bad {
            background: #ef4444;
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.14);
        }

        .cctv-mini-popup-loading .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 700;
            border-radius: 999px;
        }

        .cctv-mini-popup-loading-text {
            color: #cbd5e1;
            font-size: 11px;
            line-height: 1.4;
        }

        .cctv-mini-popup-error i {
            font-size: 22px;
            color: var(--txt-dim);
        }

        .cctv-mini-popup-info {
            padding: 7px 10px;
            border-top: 1px solid var(--border-dim);
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin: 0;
        }

        .cctv-mini-popup-info-row {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .cctv-mini-popup-info-key {
            font-size: 10px;
            color: var(--txt-dim);
            white-space: nowrap;
            min-width: 28px;
        }

        .cctv-mini-popup-info-val {
            margin: 0;
            font-size: 11px;
            color: var(--txt-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cctv-mini-popup-event-type {
            padding: 1px 7px;
            border-radius: 999px;
            background: var(--danger-bg);
            color: #fca5a5;
            font-size: 10px;
            font-weight: 700;
        }

        .cctv-mini-popup-actions {
            display: flex;
            gap: 5px;
            padding: 6px 8px;
            border-top: 1px solid var(--border-dim);
            background: rgba(255, 255, 255, 0.015);
        }

        .cctv-mini-popup-action-btn {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            height: 30px;
            border-radius: 7px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
            color: var(--txt-muted);
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: background .15s, color .15s;
        }

        .cctv-mini-popup-action-btn:hover {
            background: rgba(255, 255, 255, 0.09);
            color: var(--txt);
        }

        .hub-card {
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.2);
        }

        .hub-card--event {
            min-height: clamp(280px, 42vh, 560px);
        }

        .hub-card--equip {
            min-height: 210px;
        }

        .hub-card--bc {
            min-height: 180px;
        }

        .hub-card-hd {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            min-height: 50px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border-dim);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.015));
        }

        .hub-card-title {
            margin: 0;
            font-size: 10px;
            font-weight: 800;
            color: var(--txt-muted);
            text-transform: uppercase;
            letter-spacing: 0.07em;
        }

        .hub-badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 800;
        }

        .hub-badge--alert {
            background: var(--danger-bg);
            color: #fca5a5;
        }

        .hub-meta {
            font-size: 11px;
            color: var(--txt-dim);
        }

        .hub-event-body,
        .hub-equip-body,
        .hub-bc-body {
            min-height: 0;
            overflow-y: auto;
            scrollbar-width: thin;
        }

        .hub-event-body {
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            scrollbar-color: rgba(148, 163, 184, 0.15) transparent;
        }

        .hub-event-body::-webkit-scrollbar,
        .hub-equip-body::-webkit-scrollbar,
        .hub-bc-body::-webkit-scrollbar {
            width: 3px;
        }

        .hub-event-body::-webkit-scrollbar-thumb,
        .hub-equip-body::-webkit-scrollbar-thumb,
        .hub-bc-body::-webkit-scrollbar-thumb {
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.15);
        }

        /* ── 타임라인 이벤트 목록 ── */
        .hub-tl-item {
            display: flex;
            align-items: stretch;
            gap: 10px;
            padding: 0;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
            cursor: pointer;
        }

        .hub-tl-track {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
            width: 16px;
            padding-top: 4px;
        }

        .hub-tl-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ef4444;
            border: 2px solid rgba(239, 68, 68, 0.35);
            flex-shrink: 0;
            transition: background .2s, box-shadow .2s;
        }

        .hub-tl-line {
            flex: 1;
            width: 2px;
            background: rgba(255, 255, 255, 0.07);
            margin-top: 4px;
            min-height: 12px;
            border-radius: 1px;
        }

        .hub-tl-item:last-child .hub-tl-line {
            display: none;
        }

        .hub-tl-content {
            flex: 1;
            min-width: 0;
            padding: 4px 6px 10px 0;
            border-bottom: 1px solid var(--border-dim);
            transition: opacity .15s;
        }

        .hub-tl-item:last-child .hub-tl-content {
            border-bottom: none;
        }

        .hub-tl-item:hover .hub-tl-dot {
            background: #f87171;
        }

        .hub-tl-content:hover {
            opacity: 0.85;
        }

        .hub-tl-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 3px;
        }

        .hub-tl-main {
            display: flex;
            align-items: baseline;
            gap: 6px;
            min-width: 0;
        }

        .hub-tl-meta .hub-ev-quick {
            display: flex;
            margin-left: auto;
        }

        .hub-ev-t {
            font-size: 11px;
            font-weight: 800;
            color: var(--txt-muted);
            font-variant-numeric: tabular-nums;
            line-height: 1.25;
            white-space: nowrap;
        }

        .hub-ev-zone {
            font-size: 12px;
            font-weight: 800;
            color: #f1f5f9;
            white-space: nowrap;
        }

        .hub-ev-type {
            padding: 1px 6px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 700;
            background: var(--danger-bg);
            color: #fca5a5;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .hub-ev-cam {
            font-size: 10px;
            color: var(--txt-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .hub-equip-body {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            scrollbar-color: rgba(148, 163, 184, 0.12) transparent;
        }

        .hub-dev-item {
            display: grid;
            grid-template-columns: 18px minmax(0, 1fr) auto;
            align-items: center;
            gap: 10px;
            min-height: 42px;
            padding: 9px 12px;
            border-radius: 10px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.02));
            border: 1px solid rgba(255, 255, 255, 0.04);
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: background .15s, border-color .15s, transform .15s, box-shadow .15s;
        }

        .hub-dev-item[data-cctv-code]:hover {
            background: var(--accent-glow);
            border-color: rgba(96, 165, 250, 0.28);
            box-shadow: 0 10px 22px rgba(15, 23, 42, 0.2);
            transform: translateY(-1px);
        }

        div.hub-dev-item {
            cursor: default;
        }

        .hub-dev-icon {
            font-size: 15px;
            flex-shrink: 0;
            justify-self: center;
        }

        .hub-dev-icon.is-on {
            color: var(--safe);
        }

        .hub-dev-icon.is-off {
            color: var(--danger);
        }

        .hub-dev-name {
            flex: 1;
            font-size: 12px;
            font-weight: 600;
            color: #dbe6f3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.35;
        }

        .hub-dev-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 42px;
            min-height: 24px;
            font-size: 10px;
            font-weight: 800;
            padding: 0 8px;
            border-radius: 999px;
            flex-shrink: 0;
            letter-spacing: 0.02em;
        }

        .hub-dev-badge.is-on {
            background: rgba(34, 197, 94, 0.12);
            color: #86efac;
        }

        .hub-dev-badge.is-off {
            background: var(--danger-bg);
            color: #fca5a5;
        }

        .hub-bc-body {
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .hub-bc-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 6px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.02);
        }

        .hub-bc-icon {
            color: var(--accent);
            font-size: 11px;
            flex-shrink: 0;
        }

        .hub-bc-name {
            flex: 1;
            font-size: 11px;
            color: var(--txt-muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .hub-bc-status {
            font-size: 11px;
            font-weight: 800;
            flex-shrink: 0;
        }

        .hub-bc-status.is-ok {
            color: var(--safe);
        }

        .hub-bc-status.is-fail {
            color: var(--danger);
        }

        .hub-bc-time {
            font-size: 10px;
            color: var(--txt-dim);
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
        }

        .hub-empty {
            padding: 12px 0;
            text-align: center;
            font-size: 11px;
            color: var(--txt-dim);
        }

        .cctv-mini-popup.is-below {
            transform: translate(-50%, 18px);
        }

        .cctv-mini-popup.is-below::after {
            bottom: auto;
            top: -8px;
            border-top: none;
            border-bottom: 8px solid var(--bg-card);
        }

        .hub-ev-quick {
            gap: 3px;
            flex-shrink: 0;
        }

        .hub-ev-q-btn {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.06);
            color: var(--txt-muted);
            cursor: pointer;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .12s, color .12s;
        }

        .hub-ev-q-btn:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        #opsChipCctvOff,
        #opsChipSpkOff {
            cursor: pointer;
            transition: background .15s;
        }

        #opsChipCctvOff:hover,
        #opsChipSpkOff:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        @media (max-width: 1199.98px) {
            .hub-map-card {
                min-height: 420px;
            }
        }

        @media (min-width: 1200px) {
            .hub-body {
                height: calc(100% - 4px);
                align-items: stretch;
            }

            .hub-body>.hub-map-section {
                min-width: 0;
                overflow: hidden;
            }

            .hub-body>.hub-panel {
                height: 100%;
            }

            .hub-map-card {
                height: min(100%, var(--hub-map-height-xl));
                min-height: 0;
            }

            .hub-panel>.row {
                height: 100%;
                flex-direction: column;
                flex-wrap: nowrap;
            }

            .hub-panel>.row>div:first-child {
                flex: 1 1 0;
                min-height: 0;
            }

            .hub-panel>.row>div:nth-child(2) {
                flex: 0 0 28%;
                min-height: 0;
            }

            .hub-panel>.row>div:nth-child(3) {
                flex: 0 0 24%;
                min-height: 0;
            }

            .hub-card--event,
            .hub-card--equip,
            .hub-card--bc {
                min-height: 0;
            }
        }

        @media (max-width: 767.98px) {
            .hub-shell {
                height: auto;
                min-height: 0;
                overflow-y: auto;
            }

            .hub-bar {
                min-height: auto;
                padding: 8px 10px;
            }

            .hub-bar-actions {
                width: 100%;
                justify-content: flex-start;
            }

            .hub-btn {
                min-height: 34px;
                padding: 0 9px;
            }

            .hub-map-card {
                min-height: 340px;
            }

            .hub-map-legend {
                left: 10px;
                right: 10px;
                bottom: 10px;
                min-width: 0;
                padding: 10px 11px;
            }

            .hub-card--event,
            .hub-card--equip,
            .hub-card--bc {
                min-height: 180px;
            }

            .cctv-mini-popup {
                width: min(360px, calc(100vw - 20px));
            }
        }
    </style>

    <script src="/js/ui/modal_speaker_setting.js?v=1"></script>
    <script src="/js/ui/modal_speaker_broadcast.js?v=1"></script>
</head>

<body>
    <div layout:fragment="content">
        <main class="map-hub">
            <div class="container-fluid px-2 px-lg-3 py-3 hub-shell d-flex flex-column gap-3">

                <header class="hub-toolbar">
                    <div class="hub-bar">
                        <div class="hub-bar-status">
                            <span class="hub-chip hub-chip--warn badge rounded-pill" id="opsChipCctvOff"
                                style="display:none">
                                <i class="bi bi-camera-video-off-fill" aria-hidden="true"></i>
                                CCTV 이상 <strong id="opsShiftCctvOff">0</strong>대
                            </span>
                            <span class="hub-chip hub-chip--warn badge rounded-pill" id="opsChipSpkOff"
                                style="display:none">
                                <i class="bi bi-speaker-fill" aria-hidden="true"></i>
                                스피커 이상 <strong id="opsShiftSpkOff">0</strong>대
                            </span>
                        </div>

                        <nav class="hub-bar-actions" aria-label="페이지 액션">
                            <button type="button" class="hub-btn hub-btn--urgent btn" data-bs-toggle="modal"
                                data-bs-target="#speaker_broadcast_modal">
                                <i class="bi bi-broadcast-pin" aria-hidden="true"></i>
                                <span>긴급방송</span>
                            </button>
                            <button type="button" class="hub-btn hub-btn--ghost btn" data-bs-toggle="modal"
                                data-bs-target="#speaker_setting_modal" aria-label="스피커 설정">
                                <i class="bi bi-sliders" aria-hidden="true"></i>
                                <span class="d-none d-sm-inline">설정</span>
                            </button>
                            <a class="hub-btn hub-btn--ghost btn" th:href="@{/menu/equipment2}" title="장비관리"
                                aria-label="장비관리">
                                <i class="bi bi-tools" aria-hidden="true"></i>
                                <span class="d-none d-sm-inline">장비관리</span>
                            </a>
                            <a class="hub-btn hub-btn--ghost btn" th:href="@{/main}" title="상황판" aria-label="상황판으로 이동">
                                <i class="bi bi-grid-1x2" aria-hidden="true"></i>
                                <span class="d-none d-sm-inline">상황판</span>
                            </a>
                        </nav>
                    </div>
                </header>

                <div class="hub-body row g-3 flex-grow-1">

                    <section class="hub-map-section col-12 col-xl-8" aria-label="CCTV 지도">
                        <div class="hub-map-card card border-0 h-100">
                            <div class="hub-map-actions">
                                <button type="button" class="css-action-btn btn btn-dark" id="hubRefreshMapBtn"
                                    aria-label="지도 새로고침">
                                    <i class="bi bi-arrow-clockwise" aria-hidden="true"></i>
                                </button>
                            </div>

                            <section class="hub-map-legend" aria-label="지도 범례">
                                <h2 class="hub-map-legend-title">범례</h2>
                                <ul class="hub-map-legend-list">
                                    <li class="hub-map-legend-item">
                                        <span class="hub-map-legend-chip is-normal" aria-hidden="true"></span>
                                        <span class="hub-map-legend-label">장비 정상</span>
                                    </li>
                                    <li class="hub-map-legend-item">
                                        <span class="hub-map-legend-chip is-offline" aria-hidden="true"></span>
                                        <span class="hub-map-legend-label">장비 오프라인</span>
                                    </li>
                                </ul>
                            </section>

                            <div id="map"></div>
                            <div id="mapTooltip" class="d-none"></div>

                            <div id="cctvMiniPopup" class="cctv-mini-popup" style="display:none" role="dialog"
                                aria-modal="true" aria-labelledby="cctvPopupName">
                                <div class="cctv-mini-popup-hd">
                                    <div class="cctv-mini-popup-title-area">
                                        <span class="cctv-mini-popup-status-dot" id="cctvPopupDot"
                                            aria-hidden="true"></span>
                                        <span class="cctv-mini-popup-name" id="cctvPopupName">-</span>
                                    </div>
                                    <button type="button" class="cctv-mini-popup-close" id="cctvPopupClose"
                                        aria-label="팝업 닫기">
                                        <i class="bi bi-x" aria-hidden="true"></i>
                                    </button>
                                </div>

                                <div class="cctv-mini-popup-video-wrap">
                                    <video id="cctvPopupVideo" autoplay muted playsinline aria-label="CCTV 영상"></video>
                                    <div class="cctv-mini-popup-loading" id="cctvPopupLoading" aria-live="polite">
                                        <div class="cctv-mini-popup-loading-message">
                                            <span class="badge" id="cctvPopupLoadingBadge">
                                                <span class="status-dot ok" id="cctvPopupLoadingDot"
                                                    aria-hidden="true"></span>
                                                <span id="cctvPopupLoadingState">정상</span>
                                            </span>
                                            <span class="cctv-mini-popup-loading-text" id="cctvPopupLoadingText">영상 연결
                                                중...</span>
                                        </div>
                                    </div>
                                    <div class="cctv-mini-popup-error" id="cctvPopupError" style="display:none">
                                        <i class="bi bi-camera-video-off" aria-hidden="true"></i>
                                        <span>영상 없음</span>
                                    </div>
                                </div>

                                <dl class="cctv-mini-popup-info">
                                    <div class="cctv-mini-popup-info-row">
                                        <dt class="cctv-mini-popup-info-key">상태</dt>
                                        <dd class="cctv-mini-popup-info-val" id="cctvPopupStatus">-</dd>
                                    </div>
                                    <div class="cctv-mini-popup-info-row">
                                        <dt class="cctv-mini-popup-info-key">위치</dt>
                                        <dd class="cctv-mini-popup-info-val" id="cctvPopupAddress">-</dd>
                                    </div>
                                    <div class="cctv-mini-popup-info-row" id="cctvPopupEventRow" style="display:none">
                                        <dt class="cctv-mini-popup-info-key">이벤트</dt>
                                        <dd class="cctv-mini-popup-info-val cctv-mini-popup-event-type"
                                            id="cctvPopupEventType">-</dd>
                                    </div>
                                </dl>

                                <div class="cctv-mini-popup-actions">
                                    <button type="button" class="cctv-mini-popup-action-btn" data-bs-toggle="modal"
                                        data-bs-target="#speaker_broadcast_modal">
                                        <i class="bi bi-broadcast-pin" aria-hidden="true"></i> 방송
                                    </button>
                                </div>
                            </div>
                        </div>
                    </section>

                    <aside class="hub-panel col-12 col-xl-4" aria-label="운영 패널">
                        <div class="row g-3 h-100">
                            <div class="col-12">
                                <section class="hub-card hub-card--event card border-0 h-100"
                                    aria-labelledby="cardTitleEvents">
                                    <div class="hub-card-hd card-header border-0">
                                        <h2 class="hub-card-title" id="cardTitleEvents">실시간 이벤트</h2>
                                        <span class="hub-badge hub-badge--alert" id="hubEventCount"
                                            aria-live="polite">0건</span>
                                    </div>
                                    <div class="hub-event-body hub-tl card-body" id="hubEventList" role="log"
                                        aria-live="polite" aria-label="이벤트 목록">
                                        <div class="hub-empty">데이터 로딩 중...</div>
                                    </div>
                                </section>
                            </div>

                            <div class="col-12 col-md-6 col-xl-12">
                                <section class="hub-card hub-card--equip card border-0 h-100"
                                    aria-labelledby="cardTitleEquip">
                                    <div class="hub-card-hd card-header border-0">
                                        <h2 class="hub-card-title" id="cardTitleEquip">장비 현황</h2>
                                        <span class="hub-meta" id="hubEquipMeta" aria-live="polite">-</span>
                                    </div>
                                    <div class="hub-equip-body card-body" id="hubEquipBody"></div>
                                </section>
                            </div>

                            <div class="col-12 col-md-6 col-xl-12">
                                <section class="hub-card hub-card--bc card border-0 h-100"
                                    aria-labelledby="cardTitleBc">
                                    <div class="hub-card-hd card-header border-0">
                                        <h2 class="hub-card-title" id="cardTitleBc">방송 이력</h2>
                                        <span class="hub-meta" id="hubBcCount" aria-live="polite">0건</span>
                                    </div>
                                    <div class="hub-bc-body card-body" id="hubBcList"></div>
                                </section>
                            </div>
                        </div>
                    </aside>
                </div>
            </div>

        </main>

        <span id="brandCctvListCount" hidden></span>
        <span id="brandBroadcastListCount" hidden></span>

        <script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>
        <script th:src="@{/js/module/janus.js}"></script>
        <script th:src="@{/js/module/map.js}"></script>
        <script th:src="@{/js/module/cctv_janus.js}"></script>
        <script th:src="@{/js/page/brand_hub_page.js}"></script>
    </div>
</body>

</html>
