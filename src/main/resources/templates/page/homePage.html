<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">

<head>
    <meta charset="UTF-8">
    <title th:text="${title}">SafeSystem</title>
    <!-- Deprecated: footer.js -->

    <!-- Deprecated: Naver Map API -->
    <link rel="stylesheet" href="css/weather.css">
    <link rel="stylesheet" href="css/cctv-placeholder.css">
    <link rel="stylesheet" href="css/map.css">
    <!-- Library: OpenLayers -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.4.0/ol.css" />
    <script src="https://cdn.jsdelivr.net/npm/ol@7.4.0/dist/ol.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Deprecated: WebRTC adapter CDN -->
    <script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>
    <!-- Deprecated: Janus demo CDN -->
    <!-- Deprecated: Janus latest CDN -->
    <script src="js/module/janus.js"></script>

    <!-- Data: server values for JavaScript -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        var cameras = /*[[${cameras}]]*/[];
        var mapApiKey = /*[[${mapApiKey}]]*/ "";
        // var speakerList = /*[[${speakerList}]]*/ [];
        /*]]>*/
    </script>
    <script>
        window.VWORLD_API_KEY = /*[[${mapApiKey}]]*/ "";
    </script>
    <script src="/js/jsmpeg.min.js"></script>

    <script src="/js/scripts.js?v=1"></script>
    <script src="/js/module/map.js?v=1"></script>
    <script src="/js/module/weather.js?v=1"></script>
    <script src="/js/module/cctv_layout.js?v=1"></script>
    <script src="/js/module/cctv_janus.js?v=1"></script>
    <script src="/js/module/logs.js?v=1"></script>
    <script src="/js/module/mqtt.js?v=1"></script>
    <script src="/js/ui/modal_speaker_setting.js?v=1"></script>
    <script src="/js/ui/modal_speaker_broadcast.js?v=1"></script>
    <script src="/js/ui/modal_tts_manage.js?v=1"></script>

    <!-- Deprecated: btype_action_modal.js -->
</head>

<body>
    <!-- Section: Main -->
    <div class="main-container p-0" layout:fragment="content">
        <div class="control-bar p-2 rounded-0">
            <div class="control-group">
                <div class="dropdown-container dropdown-sm">
                    <button class="btn-apple-base btn-apple-light btn-dropdown btn-sm" onclick="toggleDropdown(this)">
                        <span id="selected-layout">4분할 화면 (2x2)</span>
                        <span class="dropdown-arrow">▼</span>
                    </button>
                    <div class="dropdown-menu">
                        <div class="dropdown-item" data-layout="1" onclick="selectLayout(this)">
                            <span>1분할 화면 (1x1)</span>
                        </div>
                        <div class="dropdown-item selected" data-layout="4" onclick="selectLayout(this)">
                            <span>4분할 화면 (2x2)</span>
                        </div>
                        <div class="dropdown-item" data-layout="9" onclick="selectLayout(this)">
                            <span>9분할 화면 (3x3)</span>
                        </div>
                        <div class="dropdown-item" data-layout="16" onclick="selectLayout(this)">
                            <span>16분할 화면 (4x4)</span>
                        </div>
                    </div>
                </div>

                <button class="btn-apple-base btn-apple-light btn-sm d-none" id="mapBtn">
                    <i class="bi bi-geo-alt-fill"></i>
                    <span class="d-none d-md-inline">지도화면</span>
                </button>

                <button class="btn-apple-base btn-apple-light btn-sm" id="speakerList" data-bs-toggle="modal"
                    data-bs-target="#speaker_setting_modal">
                    <i class="bi bi-list"></i>
                    <span class="d-none d-md-inline">스피커 정보</span>
                </button>

                <button type="button" data-bs-toggle="modal" data-bs-target="#speaker_broadcast_modal"
                    class="btn-apple-base btn-apple-danger btn-sm">
                    <i class="bi bi-exclamation-triangle"></i>
                    <span class="d-none d-md-inline">수동발령</span>
                </button>

                <!-- Action: reconnect watch -->
                <button class="btn-apple-base btn-apple-warning d-none" id="reconnectAllBtn" type="button">
                    <i class="bi bi-arrow-repeat"></i>
                    <span class="d-none d-md-inline">전체 재연결</span>
                </button>

                <!-- Action: restart streaming server -->
                <button class="btn-apple-base btn-apple-warning btn-sm" id="restartAllServerBtn" type="button">
                    <i class="bi bi-arrow-clockwise"></i>
                    <span class="d-none d-md-inline">CCTV 전체 재시작</span>
                </button>

                <button class="btn-apple-base btn-apple-warning btn-sm d-none" id="testBtn" type="button">테스트</button>
            </div>
        </div>

        <div class="content-wrapper p-2">
            <div class="main-section rounded-0 p-0">
                <div id="cctv-container">
                    <!-- Block: CCTV feed container -->
                </div>

                <!-- Section: Map -->
                <div id="map-container" class="d-none">
                    <div class="camera-status-summary">
                        <div class="css-panel-header">
                            <div class="css-panel-title">
                                <div class="device-filter-tabs" id="deviceFilterChips">
                                    <button type="button" class="device-filter-tab is-active" data-filter="all">
                                        전체 <span class="dft-count" id="filterCountAll">0</span>
                                    </button>
                                    <button type="button" class="device-filter-tab" data-filter="cctv">
                                        <i class="bi bi-camera-video-fill"></i><span class="dft-count"
                                            id="filterCountCctv">0</span>
                                    </button>
                                    <button type="button" class="device-filter-tab" data-filter="speaker">
                                        <i class="bi bi-volume-up-fill"></i><span class="dft-count"
                                            id="filterCountSpeaker">0</span>
                                    </button>
                                </div>
                            </div>
                            <div class="css-panel-actions">
                                <button type="button" class="css-action-btn" id="refreshMap" title="새로고침"
                                    aria-label="지도 새로고침">
                                    <i class="bi bi-arrow-clockwise"></i>
                                </button>
                                <button type="button" class="css-action-btn" id="deviceStatusToggle"
                                    aria-expanded="true" aria-controls="deviceStatusLists" title="목록 접기">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </div>
                        </div>
                        <div class="css-panel-body" id="deviceStatusLists">
                            <div class="device-status-list" id="deviceStatusList"></div>
                        </div>
                    </div>
                    <div id="map">
                        <div id="mapTooltip" class="map-tooltip"></div>
                    </div>
                </div>
            </div>

            <div class="sidebar">

                <!-- Section: 출입기록 -->
                <div class="sb-sec">
                    <div class="sb-hd">
                        <span class="sb-hd-title">
                            <i class="bi bi-door-open-fill" style="opacity:.6;"></i>
                            출입기록
                        </span>
                        <div class="sb-hd-right">
                            <span id="logCount" class="sb-cnt-badge">0건</span>
                        </div>
                    </div>
                    <div class="sb-log-body">
                        <div id="logContainer"></div>
                        <div id="emptyLogMessage" class="d-none sb-log-empty-state">
                            <div class="sb-log-empty-icon" aria-hidden="true">
                                <i class="bi bi-door-closed"></i>
                            </div>
                            <div class="sb-log-empty-copy">
                                <strong>아직 수신된 출입기록이 없습니다</strong>
                                <p class="mb-0">새로운 출입 이벤트가 발생하면 표시됩니다.</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Section: 특보 (hidden) -->
                <div class="sb-sec d-none" id="specialReportPanel">
                    <div class="sb-hd d-none">
                        <span class="sb-hd-title">
                            <i class="bi bi-exclamation-triangle-fill" style="opacity:.6;"></i>
                            특보
                        </span>
                        <span class="sb-cnt-badge" id="specialReportBadge">오늘</span>
                    </div>
                    <div class="sb-special-body">
                        <div id="specialReportLine" class="special-line" style="opacity:0.92;">
                            불러오는 중...
                        </div>
                        <div id="specialReportEmpty" class="d-none special-line" style="opacity:0.92;">
                            <i class="bi bi-exclamation-circle fs-6 text-muted"></i>
                            <span class="sr-wrn-text text-muted">오늘 특보 없음</span>
                        </div>
                    </div>
                </div>

                <!-- Section: 현재 날씨 -->
                <div class="sb-sec">
                    <div class="sb-hd">
                        <span class="sb-hd-title">
                            <i class="bi bi-cloud-sun-fill" style="opacity:.6;"></i>
                            현재 날씨
                        </span>
                    </div>

                    <!-- Block: 하늘 배너 -->
                    <div class="sb-wx-banner wx-clear" id="sbWxBanner">
                        <div class="sb-wx-fx" aria-hidden="true" id="sbWxFx"></div>
                        <!-- Block: 날씨 콘텐츠 -->
                        <div class="sb-wx-banner-content">
                            <img id="weather_icon" alt="날씨" class="sb-wx-icon" />
                            <div style="display:flex;align-items:baseline;gap:3px;">
                                <span class="sb-wx-temp" id="temperature"></span>
                            </div>
                            <div class="sb-wx-meta">
                                <div class="sb-wx-cond" id="weather"></div>
                                <div class="sb-wx-loc" id="weather_loc">현재 날씨 정보</div>
                            </div>
                        </div>
                    </div>

                    <!-- Block: 날씨 지표 그리드 -->
                    <div class="sb-wx-metrics">
                        <div class="sb-wx-cell">
                            <div class="sb-wx-lbl">강수량</div>
                            <div class="sb-wx-val" id="rainfall">-</div>
                        </div>
                        <div class="sb-wx-cell">
                            <div class="sb-wx-lbl">습도</div>
                            <div class="sb-wx-val" id="humidity">-</div>
                        </div>
                        <div class="sb-wx-cell">
                            <div class="sb-wx-lbl">풍속</div>
                            <div class="sb-wx-val" id="windSpeed">-</div>
                        </div>
                        <div class="sb-wx-cell">
                            <div class="sb-wx-lbl">풍향</div>
                            <div class="sb-wx-val" id="windDirection" style="display:flex;align-items:center;gap:3px;">
                                <i id="windIcon" class="fa-solid fa-location-arrow"
                                    style="font-size:12px;color:#4fc3f7;"></i>
                                <span id="windText"></span>
                            </div>
                        </div>
                    </div>

                    <!-- Block: 공기질 -->
                    <div class="sb-aq-row">
                        <div class="sb-aq-cell">
                            <span class="sb-aq-lbl">미세먼지(PM10)</span>
                            <div class="sb-aq-right">
                                <span class="air-quality-grade" id="pm10Grade">-</span>
                                <span class="air-quality-value" id="pm10Value"
                                    style="font-size:10px;font-weight:700;">-</span>
                            </div>
                        </div>
                        <div class="sb-aq-cell">
                            <span class="sb-aq-lbl">초미세먼지(PM2.5)</span>
                            <div class="sb-aq-right">
                                <span class="air-quality-grade" id="pm25Grade">-</span>
                                <span class="air-quality-value" id="pm25Value"
                                    style="font-size:10px;font-weight:700;">-</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Section: 레이더 / 위성 -->
                <div class="sb-sec sb-sec-fluid">
                    <div class="sb-hd">
                        <span class="sb-hd-title">
                            <i class="fa-solid fa-satellite" style="opacity:.6;font-size:9px;"></i>
                            날씨 영상
                        </span>
                        <div class="sb-radar-toggle">
                            <button class="toggle-btn active" onclick="Weather.switchRadarType('radar', this)">
                                <i class="fa-solid fa-broadcast-tower me-1"></i>레이더
                            </button>
                            <button class="toggle-btn" onclick="Weather.switchRadarType('satellite', this)">
                                <i class="fa-solid fa-satellite me-1"></i>위성
                            </button>
                        </div>
                    </div>
                    <div class="sb-radar-body">
                        <div class="sb-radar-map-wrap">
                            <!-- Block: 레이더 지도 -->
                            <div class="weather-map w-100 position-relative" id="radar-map">
                                <div id="loadingSpinnerRadar"
                                    class="d-flex justify-content-center align-items-center flex-column position-absolute w-100 h-100">
                                    <div class="spinner-border spinner-border-sm text-secondary" role="status"></div>
                                    <div class="mt-2 small text-white-50" style="font-size:10px;">레이더 로딩중...</div>
                                </div>
                                <img id="radarImg" class="d-none w-100" alt="레이더 지도">
                            </div>
                            <!-- Block: 위성 지도 -->
                            <div class="weather-map w-100 d-none position-relative" id="satellite-map">
                                <div id="loadingSpinnerSatellite"
                                    class="d-flex justify-content-center align-items-center flex-column position-absolute w-100 h-100">
                                    <div class="spinner-border spinner-border-sm text-secondary" role="status"></div>
                                    <div class="mt-2 small text-white-50" style="font-size:10px;">위성 로딩중...</div>
                                </div>
                                <img id="satelliteImg" class="d-none w-100" alt="위성 지도">
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Section: 하단 Ticker Bar -->
        <div class="ticker-bar" id="tickerBar">
            <div class="ticker-legend-panel">
                <div class="ticker-panel-title">
                    <i class="bi bi-camera-video-fill"></i>
                    <span>CCTV 구역</span>
                </div>
                <div class="ticker-legend-list">
                    <div class="ticker-legend-item">
                        <span class="ticker-zone-badge is-zone-1">1번 구역</span>
                    </div>
                    <div class="ticker-legend-item">
                        <span class="ticker-zone-badge is-zone-2">2번 구역</span>
                    </div>
                    <div class="ticker-legend-item">
                        <span class="ticker-zone-badge is-zone-3">3번 구역</span>
                    </div>
                    <div class="ticker-legend-item">
                        <span class="ticker-zone-badge is-zone-4">4번 구역</span>
                    </div>
                </div>
            </div>
            <div class="ticker-alert-panel">
                <div class="ticker-tag" id="tickerTag">
                    <div class="ticker-tag-dot"></div>
                    <span id="tickerTagLabel">특보</span>
                </div>
                <div class="ticker-track">
                    <div class="ticker-inner" id="tickerInner">
                        <span class="t-item t-empty">수신된 특보 정보가 없습니다.</span>
                    </div>
                </div>
                <button type="button" class="ticker-toggle-btn" id="tickerToggleBtn" aria-label="하단 특보 바 숨기기"
                    title="하단 특보 바 숨기기">
                    <i class="bi bi-chevron-down"></i>
                </button>
            </div>
        </div>
        <button type="button" class="ticker-reveal-btn" id="tickerRevealBtn" aria-label="하단 특보 바 다시 보기"
            title="하단 특보 바 다시 보기">
            <i class="bi bi-chevron-up"></i>
        </button>

        <!-- Section: 전체화면 뷰 -->
        <div id="fullscreenView" class="fullscreen-view d-none">
            <button id="closefullScreen" class="cctv-control-btn">
                <i class="bi bi-x-lg"></i>
            </button>
            <div class="fullscreen-content">
            </div>
        </div>

        <!-- Section: 출입 이벤트 알림 -->
        <div class="emergency-notification" id="emergencyNotification" aria-hidden="true">
            <div class="en-warn-icon">
                <i class="bi bi-exclamation-triangle-fill"></i>
            </div>
            <div class="en-badge">
                <i class="bi bi-shield-exclamation"></i>
                <span>출입 이벤트</span>
                <span class="en-timestamp" id="emergencyNotificationTime"></span>
            </div>
            <div class="en-cam-row">
                <i class="bi bi-camera-video-fill"></i>
                <span id="emergencyNotificationTitle"></span>
            </div>
            <div class="en-msg-row" id="emergencyNotificationMessage"></div>
            <div class="en-footer">
                <button type="button" class="en-btn-dismiss" id="emergencyNotificationClose">닫기</button>
                <button type="button" class="en-btn-broadcast" id="emergencyNotificationBroadcast">
                    <i class="bi bi-broadcast-pin"></i>
                    방송 발령
                </button>
            </div>
        </div>
        <!-- Section: Emergency Screen Overlay -->
        <div class="emergency-overlay" id="emergencyOverlay" aria-hidden="true"></div>

    </div>
</body>

</html>
