<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <script src="/js/login.js" defer></script>
</head>

<body>
    <div class="background">
    </div>
    <div class="container">
        <div class="login-card">
            <div class="logo-section">
                <h1 class="system-title">안전 재난 시스템</h1>
                <p class="subtitle">Emergency Disaster System</p>
            </div>
            <!-- Sign In Form -->
            <form class="signin-form active" th:action="@{/loginProc}" method="post">
                <div class="form-group">
                    <label for="id">아이디</label>
                    <div class="input-wrapper">
                        <input type="text" id="id" name="id" class="form-input" placeholder="아이디" required>
                        <i class="bx bxs-user input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="pw">비밀번호</label>
                    <div class="input-wrapper">
                        <input type="password" id="pw" name="pw" class="form-input" placeholder="비밀번호" required>
                        <i class="bx bxs-lock-alt input-icon"></i>
                    </div>
                </div>

                <button type="submit" class="login-btn">로그인</button>

                <!-- <div th:if="${param.error}" class="error-message">
                    <div class="alert">
                        사용자 ID 또는 Password를 확인해 주세요.
                    </div>
                </div> -->

                <div id="loginError" class="error-message" th:style="${param.error} ? '' : 'display:none;'">
                    <div class="alert" th:if="${param.error}">
                        사용자 ID 또는 Password를 확인해 주세요.
                    </div>
                </div>

                <div class="toggle-section">
                    <p class="toggle-text">계정이 없으신가요?</p>
                    <a class="toggle-btn" onclick="toggleForms()">회원가입</a>
                </div>
            </form>

            <!-- Sign Up Form -->
            <div class="signup-form">
                <div class="form-group">
                    <div class="input-wrapper">
                        <input class="form-input" type="text" id="su_id" placeholder="아이디" autocomplete="username"
                            required />
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <input class="form-input" type="text" id="su_name" placeholder="이름" required />
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <input class="form-input" type="password" id="su_pw" placeholder="비밀번호"
                            autocomplete="new-password" required />
                    </div>
                </div>
                <!-- ✅ pwConfirm 추가 -->
                <div class="form-group">
                    <div class="input-wrapper">
                        <input class="form-input" type="password" id="su_pwConfirm" placeholder="비밀번호 확인"
                            autocomplete="new-password" required />
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <input class="form-input" type="email" id="su_email" placeholder="이메일(선택)"
                            autocomplete="email" />
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <input class="form-input" type="text" id="su_phnNo" placeholder="휴대폰(선택)" autocomplete="tel" />
                    </div>
                </div>

                <button type="button" class="login-btn" id="signupBtn">회원가입</button>
                <div id="signupError" class="error-message" style="display:none;"></div>

                <div class="toggle-section">
                    <p class="toggle-text">이미 계정이 있으신가요?</p>
                    <a class="toggle-btn" onclick="toggleForms()">로그인</a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
